name: One-off unify armour art

on:
  push:
    branches:
      - chatgpt/armour-front-back-unify-20260930
    paths:
      - '.github/workflows/oneoff-unify-armour-art.yml'

permissions:
  contents: write

jobs:
  unify-armour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/armour-front-back-unify-20260930
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch armour asset selection
        run: python scripts/oneoff_unify_armour.py

      - name: Validate directional armour wiring
        shell: bash
        run: |
          grep -q "humanlightarmour_front.svg" humanoidRenderer.js
          grep -q "humanmediumarmour_front.svg" humanoidRenderer.js
          grep -q "humanheavyarmour_front.svg" humanoidRenderer.js
          grep -q "window.ARMOUR_VISUAL_ASSETS = ARMOUR_ASSETS" humanoidRenderer.js

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run focused humanoid renderer regression
        run: npx playwright test tests/human-female-direct-render.spec.js

      - name: Commit tested armour renderer change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add humanoidRenderer.js
          git diff --cached --quiet && exit 0
          git commit -m "Unify armour front and back rendering [skip ci]"
          git push origin HEAD:chatgpt/armour-front-back-unify-20260930
