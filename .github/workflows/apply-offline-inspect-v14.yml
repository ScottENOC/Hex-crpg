name: Apply offline inspect v14
on:
  push:
    branches: [development]
    paths:
      - scripts/apply_offline_inspect_v14.py
      - .github/workflows/apply-offline-inspect-v14.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inspect fix
        run: python3 scripts/apply_offline_inspect_v14.py
      - name: Validate JavaScript and inspect wiring
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          grep -q "const VERSION = '14'" offlineCache.js
          grep -q "const SW_VERSION = '14'" offlineServiceWorker.js
          grep -q "phase: 'diagnostic'" offlineCache.js
          grep -q "Inspecting local cache" offlineCache.js
          ! grep -A12 "if (choice === 'inspect')" offlineCache.js | grep -q "readLocalCopyStatus"
          grep -q 'offlineCache.js?v=14' index.html
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_offline_inspect_v14.py
          rm .github/workflows/apply-offline-inspect-v14.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineCache.js offlineServiceWorker.js index.html scripts/apply_offline_inspect_v14.py .github/workflows/apply-offline-inspect-v14.yml
          git commit -m 'Keep offline cache inspection read only'
          git pull --rebase origin development
          git push origin HEAD:development
