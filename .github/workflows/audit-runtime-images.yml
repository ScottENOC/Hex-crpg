name: Audit runtime image paths

on:
  push:
    branches: [development]
    paths:
      - 'scripts/audit-runtime-image-paths.mjs'
      - '.github/workflows/audit-runtime-images.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit runtime image paths
        run: node scripts/audit-runtime-image-paths.mjs
