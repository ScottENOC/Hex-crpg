name: Apply offline status timeout v6

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-status-timeout-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Move to latest development
        run: |
          git fetch origin development
          git checkout development
          git pull --ff-only origin development

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python3 scripts/apply-offline-status-timeout-v6.py

      - name: Syntax checks
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js

      - name: Verify v6 wiring
        run: |
          grep -q "const VERSION = '6'" offlineCache.js
          grep -q "offlineServiceWorker.js?v=6" offlineCache.js
          grep -q "STARTUP_WORKER_TIMEOUT_MS = 6000" offlineCache.js
          grep -q "allowUpdate: true" offlineCache.js
          grep -q "Local game copy detected" offlineCache.js
          grep -q "const SW_VERSION = '6'" offlineServiceWorker.js
          grep -q "offlineCache.js?v=6" index.html

      - name: Commit fix and remove one-off patcher
        run: |
          rm -f scripts/apply-offline-status-timeout-v6.py .github/workflows/apply-offline-status-timeout-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offlineCache.js offlineServiceWorker.js index.html scripts/apply-offline-status-timeout-v6.py .github/workflows/apply-offline-status-timeout-v6.yml
          git commit -m "Bound offline startup status checks"
          git push origin development
