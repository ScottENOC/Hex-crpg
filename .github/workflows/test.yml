name: Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:

permissions:
  contents: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visibility-migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && github.event.head_commit.message == 'Trigger visibility asset migration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Apply visibility asset migration
        run: |
          git pull --rebase origin development
          python scripts/apply_visibility_fix.py
          git config user.name 'ScottENOC'
          git config user.email 'bales.scott@gmail.com'
          git add clothingLayers.js clothingSystem.js characterCreation.js humanoidRenderer.js braidDirectionalHair.js name.js index.html
          git commit -m 'Stabilise trousers and directional braid rendering'
          git pull --rebase origin development
          git push origin HEAD:development

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fast Node tests
        run: npm run test:unit

  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run development smoke test
        run: npx playwright test tests/smoke.spec.js

      - name: Upload Playwright smoke failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-failures
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  playwright:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --shard=${{ matrix.shard }}/8

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
