name: Apply offline cache canonical recovery

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-cache-canonical-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply and validate recovery fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin development
          python - <<'PY'
          from pathlib import Path

          launcher = Path('offlineCache.js')
          text = launcher.read_text()
          old = """                const candidates = cacheNames
                    .filter(name => prefixes.some(prefix => name.startsWith(prefix)))
                    .filter(name => !/(?:^|-)patch(?:-|$)/i.test(name))
                    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));"""
          new = """                // Older v15 first installs could promote a fully complete cache
                // whose name still contains \"patch\". Do not hide those here:
                // incomplete staging caches have no completion manifest and are
                // rejected below, while completed ones are safe to recover.
                const candidates = cacheNames
                    .filter(name => prefixes.some(prefix => name.startsWith(prefix)))
                    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));"""
          if old not in text:
              raise SystemExit('offlineCache.js candidate filter anchor not found')
          launcher.write_text(text.replace(old, new, 1))

          worker = Path('offlineServiceWorker.js')
          text = worker.read_text()
          old = """    const patchCacheName = `${GAME_CACHE_PREFIX}patch-${commit}`;
    const patchCache = await caches.open(patchCacheName);"""
          new = """    // Incremental updates use a temporary patch cache. A first install is
    // already downloading the complete build, so give that cache its permanent
    // canonical name immediately. Recovery still accepts older completed
    // patch-named caches when they contain a valid completion manifest.
    const patchCacheName = before.valid
        ? `${GAME_CACHE_PREFIX}patch-${commit}`
        : cacheNameForCommit(commit);
    const patchCache = await caches.open(patchCacheName);"""
          if old not in text:
              raise SystemExit('offlineServiceWorker.js patch-cache anchor not found')
          worker.write_text(text.replace(old, new, 1))
          PY

          node --check offlineCache.js
          node --check offlineServiceWorker.js
          node --test tests-unit/offline-cache-regression.test.js
          grep -Fq ': cacheNameForCommit(commit);' offlineServiceWorker.js
          if grep -Fq '.filter(name => !/(?:^|-)patch(?:-|$)/i.test(name))' offlineCache.js; then
            echo 'Completed patch-named caches are still being hidden' >&2
            exit 1
          fi

          git rm .github/workflows/apply-offline-cache-canonical-recovery.yml
          git add offlineCache.js offlineServiceWorker.js
          git diff --cached --check
          git commit -m 'Recover completed offline caches reliably'
          git pull --rebase origin development
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          node --test tests-unit/offline-cache-regression.test.js
          git push origin HEAD:development
