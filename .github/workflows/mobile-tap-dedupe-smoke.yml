name: Mobile tap dedupe smoke
on:
  pull_request:
    branches: [development]
jobs:
  mobile-tap-dedupe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run mobile tap dedupe regression
        run: npx playwright test tests/mobile-map-tap-dedupe.spec.js --project=chromium
