name: Human Female Armour Geometry Diagnostic

on:
  push:
    branches:
      - fix/shared-human-female-armour-fit

jobs:
  armour-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/armour-geometry-diagnostic.spec.js --reporter=line
