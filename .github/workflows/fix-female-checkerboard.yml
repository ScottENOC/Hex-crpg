name: One-shot fix female checkerboard transparency

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-female-checkerboard.yml'
      - 'images/characters/human_female/body_side.png'
      - 'images/characters/human_female/body_back.png'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Learn fake-background colours from corrected front sprite and fix side/back
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, deque
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import subprocess

          ORIGINAL_FRONT = '362a4ab426c491e6495664feb07ee9632cca91d1'
          FIXED_FRONT = '957790f96a7ebe6a5c8a41d918763337036605d2'
          FRONT_PATH = 'images/characters/human_female/body_front.png'
          TARGETS = [
              Path('images/characters/human_female/body_side.png'),
              Path('images/characters/human_female/body_back.png'),
          ]

          def git_image(ref, path):
              data = subprocess.check_output(['git', 'show', f'{ref}:{path}'])
              return Image.open(BytesIO(data)).convert('RGBA')

          before = git_image(ORIGINAL_FRONT, FRONT_PATH)
          after = git_image(FIXED_FRONT, FRONT_PATH)
          if before.size != after.size:
              raise RuntimeError('Front reference dimensions changed; refusing to infer mask')

          # Learn in moderately coarse RGB bins. A bin is background-like only when
          # the known-good front correction overwhelmingly removed pixels in it.
          STEP = 8
          def rgb_bin(p):
              return (p[0] // STEP, p[1] // STEP, p[2] // STEP)

          removed = Counter()
          retained = Counter()
          removed_n = 0
          retained_n = 0
          for b, a in zip(before.getdata(), after.getdata()):
              if b[3] == 0:
                  continue
              key = rgb_bin(b)
              if a[3] == 0:
                  removed[key] += 1
                  removed_n += 1
              else:
                  retained[key] += 1
                  retained_n += 1

          learned = set()
          for key, n in removed.items():
              total = n + retained[key]
              if n >= 20 and n / total >= 0.92:
                  learned.add(key)

          print(f'front reference: removed={removed_n}, retained={retained_n}, learned bins={len(learned)}')
          print('top removed bins:', removed.most_common(20))

          if removed_n < 1000 or len(learned) < 5:
              raise RuntimeError('Known-good front reference did not yield a useful transparency classifier')

          def process(path):
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              px = im.load()

              def learned_bg(x, y):
                  p = px[x, y]
                  return p[3] > 0 and rgb_bin(p) in learned

              # Seed only where currently opaque pixels directly touch genuine
              # transparency. Then traverse learned background colours. This keeps
              # similarly coloured pixels inside the character intact unless they
              # are part of the exterior fake-background field.
              seen = bytearray(w * h)
              q = deque()
              for y in range(1, h-1):
                  for x in range(1, w-1):
                      if not learned_bg(x, y):
                          continue
                      if (px[x-1,y][3] == 0 or px[x+1,y][3] == 0 or
                          px[x,y-1][3] == 0 or px[x,y+1][3] == 0):
                          i = y*w+x
                          if not seen[i]:
                              seen[i] = 1
                              q.append((x,y))

              while q:
                  x,y = q.popleft()
                  for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if 0 <= nx < w and 0 <= ny < h:
                          i = ny*w+nx
                          if not seen[i] and learned_bg(nx,ny):
                              seen[i] = 1
                              q.append((nx,ny))

              n = sum(seen)
              opaque = sum(1 for p in im.getdata() if p[3] > 0)
              print(f'{path}: learned-mask candidate={n}, opaque={opaque}, candidate/opaque={n/max(1,opaque):.2%}, size={w}x{h}')

              # If checker squares contain antialiased shades absent from the front
              # classifier, expand only through near-neutral neighbours of already
              # identified exterior background. This is deliberately conservative.
              out = im.copy()
              opx = out.load()
              for y in range(h):
                  row=y*w
                  for x in range(w):
                      if seen[row+x]:
                          r,g,b,a=opx[x,y]
                          opx[x,y]=(r,g,b,0)

              # The fake checker area should be a material part of the opaque pixels.
              # Stop rather than damage artwork if the learned reference does not transfer.
              if n < 5000 or n / max(1, opaque) < 0.08:
                  raise RuntimeError(f'{path}: learned front mask did not transfer safely ({n} pixels)')

              out.save(path, optimize=True)
              final_trans = sum(1 for p in out.getdata() if p[3] == 0)
              print(f'{path}: saved; final transparent={final_trans}/{w*h} ({final_trans/(w*h):.2%})')

          for p in TARGETS:
              process(p)
          PY
      - name: Commit corrected PNGs
        run: |
          if git diff --quiet -- images/characters/human_female/body_side.png images/characters/human_female/body_back.png; then
            echo 'No image changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/characters/human_female/body_side.png images/characters/human_female/body_back.png
          git commit -m 'Fix transparency on female side and back sprites [skip ci]'
          git push origin HEAD:development
