name: One-shot clean female side/back transparency

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-female-checkerboard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Clean transparency without touching character component
        run: |
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          TARGETS = [
              Path('images/characters/human_female/body_side.png'),
              Path('images/characters/human_female/body_back.png'),
          ]

          for path in TARGETS:
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              px = im.load()
              seen = bytearray(w*h)
              components = []

              # Find every alpha-connected component. The real sprite is, by a very
              # large margin, the largest component; detached dots are export debris.
              for y in range(h):
                  for x in range(w):
                      i = y*w+x
                      if seen[i] or px[x,y][3] == 0:
                          continue
                      seen[i] = 1
                      q = deque([(x,y)])
                      coords = []
                      while q:
                          cx,cy = q.popleft()
                          coords.append((cx,cy))
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0 <= nx < w and 0 <= ny < h:
                                  ni = ny*w+nx
                                  if not seen[ni] and px[nx,ny][3] > 0:
                                      seen[ni] = 1
                                      q.append((nx,ny))
                      components.append(coords)

              components.sort(key=len, reverse=True)
              if not components:
                  raise RuntimeError(f'{path}: no visible component found')
              main = components[0]
              visible_total = sum(map(len, components))
              debris_total = visible_total - len(main)
              if len(main) / visible_total < 0.98:
                  raise RuntimeError(f'{path}: main component is unexpectedly small; refusing cleanup')

              main_mask = bytearray(w*h)
              for x,y in main:
                  main_mask[y*w+x] = 1

              out = im.copy()
              opx = out.load()
              changed = 0
              hidden_rgb_cleared = 0
              debris_cleared = 0
              for y in range(h):
                  row = y*w
                  for x in range(w):
                      r,g,b,a = opx[x,y]
                      if main_mask[row+x]:
                          continue  # preserve every RGBA value of the actual character
                      if a > 0:
                          opx[x,y] = (0,0,0,0)
                          changed += 1
                          debris_cleared += 1
                      elif r or g or b:
                          # Alpha-zero RGB cannot render, but normalising it removes
                          # baked checker colour data for tools that inspect raw RGB.
                          opx[x,y] = (0,0,0,0)
                          changed += 1
                          hidden_rgb_cleared += 1

              out.save(path, optimize=True)
              print(
                  f'{path}: size={w}x{h}; kept character component={len(main)} pixels; '
                  f'cleared detached alpha debris={debris_cleared}; '
                  f'cleared hidden RGB from {hidden_rgb_cleared} transparent pixels; changed={changed}'
              )
          PY
      - name: Commit corrected PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/characters/human_female/body_side.png images/characters/human_female/body_back.png
          if git diff --cached --quiet; then
            echo 'No image changes required.'
            exit 0
          fi
          git commit -m 'Clean transparency on female side and back sprites [skip ci]'
          git push origin HEAD:development
