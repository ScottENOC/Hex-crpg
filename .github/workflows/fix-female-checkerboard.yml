name: One-shot fix female checkerboard transparency

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-female-checkerboard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Profile side and back PNG pixels
        run: |
          python - <<'PY'
          from collections import Counter, deque
          from pathlib import Path
          from PIL import Image

          for path in [Path('images/characters/human_female/body_side.png'), Path('images/characters/human_female/body_back.png')]:
              im=Image.open(path).convert('RGBA'); w,h=im.size; px=im.load()
              alphas=Counter(p[3] for p in im.getdata())
              opaque=[(x,y) for y in range(h) for x in range(w) if px[x,y][3]>0]
              xs=[p[0] for p in opaque]; ys=[p[1] for p in opaque]
              bins=Counter((px[x,y][0]//8,px[x,y][1]//8,px[x,y][2]//8) for x,y in opaque)
              neutral=Counter()
              for x,y in opaque:
                  r,g,b,a=px[x,y]
                  if max(r,g,b)-min(r,g,b)<=16:
                      neutral[(r//8,g//8,b//8)] += 1
              print('\nFILE',path,'size',im.size,'opaque',len(opaque),'transparent',alphas[0],'partial alpha',sum(v for a,v in alphas.items() if 0<a<255))
              print('opaque bbox',(min(xs),min(ys),max(xs),max(ys)))
              print('top RGB8 bins',bins.most_common(30))
              print('top neutral RGB8 bins',neutral.most_common(30))

              # connected components of alpha>0
              seen=bytearray(w*h); comps=[]
              for sx,sy in opaque:
                  idx=sy*w+sx
                  if seen[idx]: continue
                  q=deque([(sx,sy)]); seen[idx]=1; n=0; minx=maxx=sx; miny=maxy=sy
                  while q:
                      x,y=q.popleft(); n+=1; minx=min(minx,x);maxx=max(maxx,x);miny=min(miny,y);maxy=max(maxy,y)
                      for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                          if 0<=nx<w and 0<=ny<h:
                              i=ny*w+nx
                              if not seen[i] and px[nx,ny][3]>0:
                                  seen[i]=1;q.append((nx,ny))
                  comps.append((n,(minx,miny,maxx,maxy)))
              comps.sort(reverse=True)
              print('components',len(comps),'top20',comps[:20])
          PY
