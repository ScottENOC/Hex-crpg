name: One-shot fix female checkerboard transparency

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-female-checkerboard.yml'
      - 'images/characters/human_female/body_side.png'
      - 'images/characters/human_female/body_back.png'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Remove checkerboard backgrounds
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter, deque
          from pathlib import Path
          from PIL import Image
          import math

          FILES = [
              Path('images/characters/human_female/body_side.png'),
              Path('images/characters/human_female/body_back.png'),
          ]

          def dist(a, b):
              return math.sqrt(sum((a[i] - b[i]) ** 2 for i in range(3)))

          def q4(v):
              return min(255, round(v / 4) * 4)

          def process(path):
              im = Image.open(path).convert('RGBA')
              w, h = im.size
              px = im.load()

              # The uploaded files have a genuinely transparent outer margin, but
              # an opaque white/grey checkerboard inset inside it. Learn checker
              # colours from opaque pixels immediately bordering real transparency.
              boundary = []
              seeds = []
              for y in range(1, h - 1):
                  for x in range(1, w - 1):
                      r, g, b, a = px[x, y]
                      if a == 0:
                          continue
                      if (px[x-1,y][3] == 0 or px[x+1,y][3] == 0 or
                          px[x,y-1][3] == 0 or px[x,y+1][3] == 0):
                          boundary.append((q4(r), q4(g), q4(b)))
                          seeds.append((x, y))

              counts = Counter(boundary)
              palette = []
              total = max(1, len(boundary))
              for colour, count in counts.most_common(24):
                  # Checker greys are neutral. Require meaningful presence on the
                  # alpha boundary so skin/clothing edge colours cannot seed removal.
                  if max(colour) - min(colour) <= 14 and count / total >= 0.005:
                      palette.append(colour)
                  if len(palette) >= 6:
                      break

              if len(palette) < 2:
                  raise RuntimeError(
                      f'{path}: could not confidently learn checker palette; '
                      f'boundary={len(boundary)} palette={palette} top={counts.most_common(12)}'
                  )

              print(f'{path}: size={w}x{h} alpha-boundary={len(boundary)} checker palette={palette}')

              def bg_like(x, y, tolerance=22):
                  r, g, b, a = px[x, y]
                  if a == 0:
                      return False
                  # Keep the match neutral as an extra guard against pale skin.
                  if max(r, g, b) - min(r, g, b) > 24:
                      return False
                  return min(dist((r, g, b), c) for c in palette) <= tolerance

              # Start only from alpha-boundary pixels that match the learnt checker
              # palette, then flood through the two checker colours. This confines
              # removal to the inset background region rather than globally deleting
              # white/grey pixels that may be legitimate clothing or highlights.
              seen = bytearray(w * h)
              q = deque()
              for x, y in seeds:
                  i = y * w + x
                  if not seen[i] and bg_like(x, y):
                      seen[i] = 1
                      q.append((x, y))

              while q:
                  x, y = q.popleft()
                  for nx, ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                      if 0 <= nx < w and 0 <= ny < h:
                          i = ny * w + nx
                          if not seen[i] and bg_like(nx, ny):
                              seen[i] = 1
                              q.append((nx, ny))

              removed = sum(seen)
              opaque = sum(1 for p in im.getdata() if p[3] > 0)
              ratio_canvas = removed / (w * h)
              ratio_opaque = removed / max(1, opaque)
              print(f'{path}: candidate checker pixels={removed} ({ratio_canvas:.2%} canvas; {ratio_opaque:.2%} opaque)')

              if removed < 10000 or ratio_opaque < 0.20 or ratio_opaque > 0.95:
                  raise RuntimeError(f'{path}: safety check rejected candidate checker removal')

              out = im.copy()
              opx = out.load()
              for y in range(h):
                  row = y * w
                  for x in range(w):
                      if seen[row + x]:
                          r, g, b, a = opx[x, y]
                          opx[x, y] = (r, g, b, 0)

              # Remove only near-checker antialias fringe directly touching the
              # newly transparent area. Two passes catch a narrow matte halo while
              # avoiding any broad erosion of the character silhouette.
              transparent = seen
              fringe_total = 0
              for _ in range(2):
                  fringe = []
                  for y in range(1, h-1):
                      row = y * w
                      for x in range(1, w-1):
                          i = row + x
                          if transparent[i] or opx[x,y][3] == 0:
                              continue
                          if not (transparent[i-1] or transparent[i+1] or
                                  transparent[i-w] or transparent[i+w]):
                              continue
                          r, g, b, a = opx[x,y]
                          if max(r,g,b)-min(r,g,b) <= 30 and min(dist((r,g,b), c) for c in palette) <= 34:
                              fringe.append((x,y,i))
                  for x, y, i in fringe:
                      r, g, b, a = opx[x,y]
                      opx[x,y] = (r,g,b,0)
                      transparent[i] = 1
                  fringe_total += len(fringe)

              out.save(path, optimize=True)
              final_transparent = sum(1 for p in out.getdata() if p[3] == 0)
              print(
                  f'{path}: removed={removed} fringe={fringe_total}; '
                  f'final transparent={final_transparent}/{w*h} ({final_transparent/(w*h):.2%}); size={w}x{h}'
              )
              return True

          changed = False
          for p in FILES:
              changed |= process(p)
          print('changed=', changed)
          PY
      - name: Commit corrected PNGs
        run: |
          if git diff --quiet -- images/characters/human_female/body_side.png images/characters/human_female/body_back.png; then
            echo 'No image changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/characters/human_female/body_side.png images/characters/human_female/body_back.png
          git commit -m 'Fix transparency on female side and back sprites [skip ci]'
          git push origin HEAD:development
