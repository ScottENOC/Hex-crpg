name: Apply all-race humanoid renderer migration

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-all-humanoid-direct-renderer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply renderer migration
        run: python3 .github/scripts/apply-all-humanoid-direct-renderer.py
      - name: Check renderer JavaScript
        run: node --check humanoidRenderer.js
      - name: Check main JavaScript
        run: node --check main.js
      - name: Check all ten direct rigs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('humanoidRenderer.js').read_text()
          expected = [
              'human_female','human_male','elf_female','elf_male','dwarf_female',
              'dwarf_male','goblin_female','goblin_male','orc_female','orc_male'
          ]
          rig_block = text.split('const CHARACTER_RIGS = {',1)[1].split('};',1)[0]
          missing = [key for key in expected if f'{key}:' not in rig_block]
          if missing:
              raise SystemExit(f'Missing direct humanoid rigs: {missing}')
          count = rig_block.count('bodyAssetMode:')
          if count != 10:
              raise SystemExit(f'Expected bodyAssetMode metadata for 10 rigs, found {count}')
          for marker in [
              'window.DIRECT_HUMANOID_RIG_KEYS',
              "CHARACTER_RIGS[key]?.bodyRender === 'visible-fit'",
              'images/characters/goblin_female/body_side.png',
              'images/characters/orc_male/body_back.png',
              'images/characters/elf_male/body.png',
          ]:
              if marker not in text:
                  raise SystemExit(f'Missing renderer marker: {marker}')
          print('All ten direct rigs present')
          PY
      - name: Check obsolete creator preloads are gone
        run: |
          ! grep -q 'images/elfmale.png' main.js
          ! grep -q 'images/elfmalehair.png' main.js
          ! grep -q 'images/dwarffemale.png' main.js
          ! grep -q 'images/dwarfmale.png' main.js
      - name: Check cache tokens
        run: |
          grep -q 'humanoidRenderer.js?v=3' index.html
          grep -q 'main.js?v=7' index.html
      - name: Check seeded presentation art
        run: |
          test -f images/characters/elf_male/body.png
          test -f images/characters/dwarf_female/body.png
          test -f images/characters/dwarf_male/body.png
          test -f images/characters/goblin_female/body_front.png
          test -f images/characters/goblin_female/body_side.png
          test -f images/characters/goblin_female/body_back.png
          test -f images/characters/orc_male/body_front.png
          test -f images/characters/orc_male/body_side.png
          test -f images/characters/orc_male/body_back.png
      - name: Remove temporary patch machinery
        run: rm .github/scripts/apply-all-humanoid-direct-renderer.py .github/workflows/apply-all-humanoid-direct-renderer.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Render all playable humanoids through direct compositor'
          git pull --rebase origin development
          git push origin HEAD:development
