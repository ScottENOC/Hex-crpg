name: Analyse clothing upload
on:
  push:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Build contact sheet and image statistics
        run: |
          cat > /tmp/analyse_clothing.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, re, numpy as np

          root=Path('images/equipment/clothing')
          files=sorted(root.glob('Grok Image 2026-10-01 at *.png'), key=lambda p:p.name)
          rows=[]
          thumbs=[]
          font=ImageFont.load_default()
          for i,p in enumerate(files,1):
              im=Image.open(p).convert('RGBA')
              arr=np.asarray(im)
              rgb=arr[:,:,:3].astype(np.int16)
              a=arr[:,:,3]
              corners=np.array([rgb[0,0],rgb[0,-1],rgb[-1,0],rgb[-1,-1]])
              bg=np.median(corners,axis=0)
              dist=np.sqrt(np.sum((rgb-bg)**2,axis=2))
              edge=np.concatenate([dist[0],dist[-1],dist[:,0],dist[:,-1]])
              alpha_frac=float(np.mean(a<250))
              bg_like=float(np.mean(dist<22))
              rows.append({'index':i,'file':p.name,'width':im.width,'height':im.height,
                           'corner_bg_rgb':[int(x) for x in bg], 'edge_bg_distance_median':float(np.median(edge)),
                           'existing_alpha_fraction':alpha_frac,'background_like_fraction':bg_like})
              thumb=im.copy()
              thumb.thumbnail((260,390))
              tile=Image.new('RGBA',(300,450),(245,245,245,255))
              # checkerboard behind transparent regions
              d=ImageDraw.Draw(tile)
              s=16
              for yy in range(0,400,s):
                  for xx in range(0,300,s):
                      if (xx//s+yy//s)%2:d.rectangle([xx,yy,xx+s-1,yy+s-1],fill=(215,215,215,255))
              x=(300-thumb.width)//2; y=(400-thumb.height)//2
              tile.alpha_composite(thumb,(x,y))
              d=ImageDraw.Draw(tile)
              label=f'{i:02d}  {p.name.split(" at ")[-1].replace(".png","")}'
              d.rectangle([0,400,299,449],fill=(255,255,255,255))
              d.text((8,407),label,fill='black',font=font)
              d.text((8,425),f'{im.width}x{im.height} bg~{tuple(int(x) for x in bg)}',fill='black',font=font)
              thumbs.append(tile.convert('RGB'))
          cols=5; tw,th=300,450; n=len(thumbs); r=(n+cols-1)//cols
          sheet=Image.new('RGB',(cols*tw,r*th),'white')
          for j,t in enumerate(thumbs): sheet.paste(t,((j%cols)*tw,(j//cols)*th))
          Path('clothing-analysis').mkdir(exist_ok=True)
          sheet.save('clothing-analysis/contact_sheet.jpg',quality=90)
          Path('clothing-analysis/analysis.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
          python /tmp/analyse_clothing.py
      - uses: actions/upload-artifact@v4
        with:
          name: clothing-analysis
          path: clothing-analysis/
