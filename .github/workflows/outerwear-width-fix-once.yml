name: Apply body-scale outerwear width fix once
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply outerwear width patch
        run: python scripts/outerwear_width_fix_once.py
      - name: Syntax check
        run: node --check clothingLayers.js
      - name: Commit fix and remove one-time helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/outerwear-width-fix-once.yml scripts/outerwear_width_fix_once.py
          git add clothingLayers.js
          git commit -m "Widen outerwear to body-scale envelopes"
          git push
