name: Apply phased local cache inspector

on:
  push:
    branches: [development]
    paths:
      - 'scripts/patch-offline-inspector-v2.py'
      - '.github/workflows/apply-offline-inspector-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inspector patch
        run: python3 scripts/patch-offline-inspector-v2.py
      - name: Validate JavaScript and inspector wiring
        run: |
          node --check offlineCache.js
          grep -q "15-inspector2" index.html
          grep -q "1/6 · Opening local metadata index" offlineCache.js
          grep -q "6/6 · Probe" offlineCache.js
          grep -q "Local cache probe" offlineCache.js
          grep -q "inspectButton.disabled = false" offlineCache.js
          if grep -A20 "async function inspectLocalCopy" offlineCache.js | grep -q "HEX_CACHE_DIAGNOSTICS"; then
            echo 'Inspector still routes through the service worker'
            exit 1
          fi
      - name: Remove temporary patch machinery
        run: rm -f scripts/patch-offline-inspector-v2.py .github/workflows/apply-offline-inspector-v2.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineCache.js index.html scripts/patch-offline-inspector-v2.py .github/workflows/apply-offline-inspector-v2.yml
          git commit -m 'Show phased local cache inspection progress'
          git pull --rebase origin development
          git push origin HEAD:development
