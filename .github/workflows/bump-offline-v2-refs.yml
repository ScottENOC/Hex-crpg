name: Bump offline cache v2 entry URLs

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/bump-offline-v2-refs.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[offline-v2-refs-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development

      - name: Bump PWA entry URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          pairs = [
              ('20261001-pwa-offline-cache-v1', '20261001-pwa-offline-cache-v2'),
              ('offlineCache.js?v=1', 'offlineCache.js?v=2'),
              ('assetLoadScheduler.js?v=6', 'assetLoadScheduler.js?v=7'),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'missing expected index token: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          grep -q 'offlineCache.js?v=2' index.html
          grep -q 'assetLoadScheduler.js?v=7' index.html
          grep -q '20261001-pwa-offline-cache-v2' index.html

      - name: Commit and remove one-off workflow
        run: |
          rm -f .github/workflows/bump-offline-v2-refs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-offline-v2-refs.yml
          git commit -m "Force iOS to load offline cache v2 [offline-v2-refs-applied]"
          git pull --rebase origin development
          git push origin HEAD:development
