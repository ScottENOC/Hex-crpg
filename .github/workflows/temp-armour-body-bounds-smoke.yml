name: Armour body-bounds smoke
on:
  pull_request:
    branches: [development]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/human-female-rig-load-order.spec.js --project=chromium
