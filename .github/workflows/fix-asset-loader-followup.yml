name: Fix asset-loader migration helper

on:
  push:
    branches: [asset-loader-followup]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Python helper if needed
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/asset-loader-followup.yml')
          source=path.read_text()
          bad="'''.replace(/^          /gm,''))"
          if bad not in source:
              print('Migration helper already repaired.')
              raise SystemExit(0)
          path.write_text(source.replace(bad,"''')"))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/asset-loader-followup.yml
          git commit -m "chore: fix asset-loader migration helper"
          git push origin HEAD:asset-loader-followup
