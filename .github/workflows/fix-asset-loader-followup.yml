name: Fix asset-loader migration helper

on:
  push:
    branches: [asset-loader-followup]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow scheduler-injection assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/asset_loader_migration.py')
          source=path.read_text()
          old="          assert.ok(!data.includes('document.write('), 'data.js must not inject scripts');\n          assert.ok(!data.includes('__assetLoadSchedulerInstalled'), 'data.js must not own scheduler installation');"
          new="          assert.ok(!data.includes('assetLoadScheduler.js?v='), 'data.js must not inject the scheduler');\n          assert.ok(!data.includes('__assetLoadSchedulerInstalled'), 'data.js must not own scheduler installation');"
          if old not in source:
              print('Scheduler-injection assertion already repaired.')
              raise SystemExit(0)
          path.write_text(source.replace(old,new))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/asset_loader_migration.py
          git commit -m "chore: target scheduler bootstrap guard"
          git push origin HEAD:asset-loader-followup
