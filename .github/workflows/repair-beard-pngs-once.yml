name: Repair beard PNGs once

on:
  push:
    branches:
      - repair-beard-pngs

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Salvage complete scanlines and validate PNGs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');

          const files = [
            'images/characters/facial_hair/beard_full_front.png',
            'images/characters/facial_hair/beard_full_side.png',
          ];
          const signature = Buffer.from([137,80,78,71,13,10,26,10]);
          const iend = Buffer.from([0,0,0,0,73,69,78,68,174,66,96,130]);

          function crc32(buffer) {
            let crc = 0xffffffff;
            for (const byte of buffer) {
              crc ^= byte;
              for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0);
            }
            return (crc ^ 0xffffffff) >>> 0;
          }

          function paeth(a, b, c) {
            const p = a + b - c;
            const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
            return pa <= pb && pa <= pc ? a : (pb <= pc ? b : c);
          }

          function unfilterRow(filter, filtered, previous, bpp = 4) {
            const out = Buffer.alloc(filtered.length);
            for (let x = 0; x < filtered.length; x++) {
              const left = x >= bpp ? out[x - bpp] : 0;
              const up = previous ? previous[x] : 0;
              const upLeft = previous && x >= bpp ? previous[x - bpp] : 0;
              let predictor = 0;
              if (filter === 1) predictor = left;
              else if (filter === 2) predictor = up;
              else if (filter === 3) predictor = Math.floor((left + up) / 2);
              else if (filter === 4) predictor = paeth(left, up, upLeft);
              else if (filter !== 0) throw new Error(`unsupported PNG filter ${filter}`);
              out[x] = (filtered[x] + predictor) & 255;
            }
            return out;
          }

          function makeChunk(type, data) {
            const typeBytes = Buffer.from(type, 'ascii');
            const out = Buffer.alloc(12 + data.length);
            out.writeUInt32BE(data.length >>> 0, 0);
            typeBytes.copy(out, 4);
            data.copy(out, 8);
            out.writeUInt32BE(crc32(Buffer.concat([typeBytes, data])), 8 + data.length);
            return out;
          }

          for (const file of files) {
            const original = fs.readFileSync(file);
            if (!original.subarray(0, 8).equals(signature)) throw new Error(`${file}: bad PNG signature`);
            if (original.toString('ascii', 12, 16) !== 'IHDR') throw new Error(`${file}: IHDR not first chunk`);
            if (original.toString('ascii', 37, 41) !== 'IDAT') throw new Error(`${file}: expected IDAT at byte 33`);
            if (!original.subarray(-12).equals(iend)) throw new Error(`${file}: intact IEND footer not found`);

            const width = original.readUInt32BE(16);
            const height = original.readUInt32BE(20);
            const bitDepth = original[24];
            const colourType = original[25];
            const interlace = original[28];
            if (bitDepth !== 8 || colourType !== 6 || interlace !== 0) {
              throw new Error(`${file}: unsupported ${width}x${height} depth=${bitDepth} colour=${colourType} interlace=${interlace}`);
            }

            const dataStart = 41;
            const dataLength = original.length - 57;
            const crcOffset = dataStart + dataLength;
            const compressed = original.subarray(dataStart, crcOffset);
            if (compressed.length < 7) throw new Error(`${file}: compressed stream too short`);
            const cmf = compressed[0], flg = compressed[1];
            if ((cmf & 0x0f) !== 8 || (((cmf << 8) | flg) % 31) !== 0 || (flg & 0x20)) {
              throw new Error(`${file}: invalid or unsupported zlib wrapper`);
            }

            // The source files are truncated near the end. Decode the surviving
            // raw-deflate payload, then preserve every COMPLETE PNG scanline.
            // Any incomplete final row plus later missing rows are replaced by
            // fully transparent pixels; no surviving pixel is altered.
            const partialRaw = zlib.inflateRawSync(compressed.subarray(2, -4));
            const stride = width * 4;
            const rowBytes = stride + 1;
            const completeRows = Math.min(height, Math.floor(partialRaw.length / rowBytes));
            if (completeRows < Math.floor(height * 0.9)) {
              throw new Error(`${file}: only ${completeRows}/${height} complete rows survive; refusing salvage`);
            }

            const pixels = [];
            let previous = null;
            for (let y = 0; y < completeRows; y++) {
              const offset = y * rowBytes;
              const filter = partialRaw[offset];
              const filtered = partialRaw.subarray(offset + 1, offset + rowBytes);
              const row = unfilterRow(filter, filtered, previous, 4);
              pixels.push(row);
              previous = row;
            }
            while (pixels.length < height) pixels.push(Buffer.alloc(stride));

            // Re-encode deterministically with filter type 0. This converts only
            // the damaged tail rows to transparent; all complete source rows are
            // reconstructed byte-for-byte at pixel level.
            const raw = Buffer.alloc(height * rowBytes);
            for (let y = 0; y < height; y++) {
              const offset = y * rowBytes;
              raw[offset] = 0;
              pixels[y].copy(raw, offset + 1);
            }
            const rebuiltIdat = zlib.deflateSync(raw, { level: 9 });
            const ihdrChunk = original.subarray(8, 33);
            const rebuilt = Buffer.concat([signature, ihdrChunk, makeChunk('IDAT', rebuiltIdat), iend]);

            // Decode the rebuilt stream normally before writing it.
            const verifyLength = zlib.inflateSync(rebuiltIdat).length;
            const expectedLength = height * rowBytes;
            if (verifyLength !== expectedLength) throw new Error(`${file}: rebuilt decode ${verifyLength} != ${expectedLength}`);

            fs.writeFileSync(file, rebuilt);
            console.log(`${file}: salvaged ${completeRows}/${height} complete rows; filled ${height - completeRows} bottom row(s) transparent`);
          }
          NODE

          npm ci
          npm run validate:png

      - name: Commit repaired binary blobs to development
        run: |
          mkdir -p /tmp/beard-png-repair
          cp images/characters/facial_hair/beard_full_front.png /tmp/beard-png-repair/
          cp images/characters/facial_hair/beard_full_side.png /tmp/beard-png-repair/

          git fetch origin development
          git checkout -B development origin/development
          cp /tmp/beard-png-repair/beard_full_front.png images/characters/facial_hair/beard_full_front.png
          cp /tmp/beard-png-repair/beard_full_side.png images/characters/facial_hair/beard_full_side.png

          npm ci
          npm run validate:png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/characters/facial_hair/beard_full_front.png images/characters/facial_hair/beard_full_side.png
          if git diff --cached --quiet; then
            echo "No beard PNG changes to commit."
            exit 0
          fi
          git commit -m "Salvage truncated full beard PNGs"
          git pull --rebase origin development
          git push origin HEAD:development
