name: Apply offline bootstrap recovery v5
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-bootstrap-v5.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: git pull --ff-only origin development
      - name: Apply patch
        run: python3 scripts/apply-offline-bootstrap-v5.py
      - name: Syntax check
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
      - name: Verify v5 wiring
        run: |
          grep -q "const VERSION = '5'" offlineCache.js
          grep -q "offlineServiceWorker.js?v=5" offlineCache.js
          grep -q "cleanupSafariOfflineControl" offlineCache.js
          grep -q "bootstrapRequest" offlineServiceWorker.js
          grep -q "cache: 'no-store'" offlineServiceWorker.js
          grep -q "offlineCache.js?v=5" index.html
      - name: Commit fix and remove one-off patcher
        run: |
          rm .github/workflows/apply-offline-bootstrap-v5.yml scripts/apply-offline-bootstrap-v5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offlineCache.js offlineServiceWorker.js index.html .github/workflows/apply-offline-bootstrap-v5.yml scripts/apply-offline-bootstrap-v5.py
          git commit -m "Keep Safari website outside offline app cache"
          git push origin HEAD:development
