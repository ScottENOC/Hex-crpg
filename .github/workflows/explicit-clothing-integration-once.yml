name: Explicit clothing integration
on:
  push:
    branches:
      - development
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - run: python3 tools/explicit_clothing_patch_once.py
      - run: |
          node --check clothingLayers.js
          node --check clothingInventoryUI.js
          node --check clothingSystem.js
          node --check humanoidRenderer.js
          node --check characterCreation.js
          node --check ui.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate explicit clothing equipment layers"
          git push origin development
