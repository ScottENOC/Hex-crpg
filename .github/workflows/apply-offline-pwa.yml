name: Apply offline PWA cache

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-pwa.yml'
      - 'scripts/apply-offline-pwa.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Fast-forward to latest development
        run: git pull --ff-only origin development
      - name: Wire offline app files into the current game
        run: node scripts/apply-offline-pwa.mjs
      - name: Syntax checks
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          node --check assetLoadScheduler.js
          node --check scripts/build-mobile-www.js
      - name: Commit finished implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-offline-pwa.mjs .github/workflows/apply-offline-pwa.yml
          git add index.html scripts/build-mobile-www.js manifest.webmanifest offlineCache.js offlineServiceWorker.js
          git commit -m "Add resilient offline iPhone cache"
          git pull --rebase origin development
          git push origin development
