name: Directional equipment anchors

on:
  push:
    branches: [fix-directional-equipment-anchors]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply directional equipment patch
        run: python tools/apply-directional-equipment-anchors.py
      - name: Syntax checks
        run: |
          node --check characterRig.js
          node --check facingSystem.js
      - name: Diff sanity
        run: git diff --check
      - name: Commit materialised source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add characterRig.js
          if git diff --cached --quiet; then
            echo 'Directional equipment source already materialised'
          else
            git commit -m 'Fix directional weapon anchors and layering'
            git pull --rebase
            git push
          fi
