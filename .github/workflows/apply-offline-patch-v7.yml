name: Apply offline patch-cache v7

on:
  push:
    branches: [development]
    paths:
      - 'scripts/apply-offline-patch-v7.py'
      - '.github/workflows/apply-offline-patch-v7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git checkout development
          git pull --ff-only origin development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/apply-offline-patch-v7.py
      - name: Syntax checks
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
      - name: Verify v7 wiring
        run: |
          grep -q "const VERSION = '7'" offlineCache.js
          grep -q "offlineServiceWorker.js?v=7" offlineCache.js
          grep -q "const SW_VERSION = '7'" offlineServiceWorker.js
          grep -q "hex-game-v6-" offlineServiceWorker.js
          grep -q "unchanged files stay in place" offlineServiceWorker.js
          grep -q "X-Hex-Offline-Miss" offlineServiceWorker.js
          grep -q "offlineCache.js?v=7" index.html
          grep -q 'rel="icon"' index.html
      - name: Commit fix and remove one-off patcher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-offline-patch-v7.py .github/workflows/apply-offline-patch-v7.yml
          git add offlineCache.js offlineServiceWorker.js index.html
          git commit -m 'Make offline updates incremental and handle cache misses'
          git push origin development
