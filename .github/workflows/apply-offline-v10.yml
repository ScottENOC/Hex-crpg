name: Apply offline worker v10

on:
  push:
    branches: [development]
    paths:
      - 'scripts/apply-offline-v10.py'
      - '.github/workflows/apply-offline-v10.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move to latest development
        run: |
          git fetch origin development
          git checkout development
          git pull --ff-only origin development

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v10 handover fix
        run: python3 scripts/apply-offline-v10.py

      - name: Validate changed JavaScript
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          grep -q "const VERSION = '10'" offlineCache.js
          grep -q "offlineServiceWorker.js?v=10" offlineCache.js
          grep -q "navigator.serviceWorker.register(SW_URL" offlineCache.js
          grep -q "const SW_VERSION = '10'" offlineServiceWorker.js
          grep -q "offlineCache.js?v=10" index.html
          grep -q "Offline engine v" offlineCache.js

      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/apply-offline-v10.py
          rm -f .github/workflows/apply-offline-v10.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix offline service worker version handover'
          git push origin development
