name: Apply full beard facial hair

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-full-beard.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply beard patch
        run: python3 .github/scripts/add-full-beard.py
      - name: Validate beard integration
        run: |
          node --check facialHairSystem.js
          node --check characterCreation.js
          test -f images/characters/facial_hair/beard_full_front.png
          test -f images/characters/facial_hair/beard_full_side.png
          grep -q "beard_full" facialHairSystem.js
          grep -q "Full beard" facialHairSystem.js
          grep -q "beard_full_front.png" facialHairSystem.js
          grep -q "beard_full_side.png" facialHairSystem.js
          grep -q "facial=20261001-beard-v1" characterCreation.js
          grep -q "characterCreation.js?v=20261001-beard1" index.html
          python3 - <<'PY'
          from pathlib import Path
          text = Path('facialHairSystem.js').read_text()
          assert "const NPC_FACIAL_HAIR_CHANCE = 0.30;" in text
          assert "Object.keys(FACIAL_HAIR_STYLES)" in text
          assert "facialHairTarget(view, bounds, style)" in text
          print('Beard joins the existing 30% adult-male NPC facial-hair pool.')
          PY
      - name: Remove temporary patch machinery
        run: rm .github/scripts/add-full-beard.py .github/workflows/apply-full-beard.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add full beard facial-hair style'
          git pull --rebase origin development
          git push origin HEAD:development
