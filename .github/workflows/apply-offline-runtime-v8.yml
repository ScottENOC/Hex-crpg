name: Apply offline runtime v8

on:
  push:
    branches: [development]
    paths:
      - 'scripts/apply-offline-runtime-v8.mjs'
      - '.github/workflows/apply-offline-runtime-v8.yml'

permissions:
  contents: write

concurrency:
  group: apply-offline-runtime-v8
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move to latest development
        run: |
          git fetch origin development
          git checkout development
          git reset --hard origin/development

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v8 repair
        run: node scripts/apply-offline-runtime-v8.mjs

      - name: Validate changed JavaScript
        run: |
          node --check network.js
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          grep -q "const SW_VERSION = '8'" offlineServiceWorker.js
          grep -q "const VERSION = '8'" offlineCache.js
          grep -q 'offlineCache.js?v=8' index.html
          grep -q 'network.js?v=8' index.html
          grep -q 'inMultiplayerSession' network.js
          grep -q 'missingPaths' offlineServiceWorker.js
          grep -q "existing.headers.get('X-Hex-Blob-Sha') === file.sha" offlineServiceWorker.js

      - name: Remove temporary audit and patch machinery
        run: |
          rm -f scripts/audit-runtime-image-paths.mjs
          rm -f .github/workflows/audit-runtime-images.yml
          rm -f scripts/apply-offline-runtime-v8.mjs
          rm -f .github/workflows/apply-offline-runtime-v8.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair offline cache holes and keep solo play offline'
          for attempt in 1 2 3; do
            git pull --rebase origin development && git push origin HEAD:development && exit 0
            sleep $((attempt * 2))
          done
          exit 1
