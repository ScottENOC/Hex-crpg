name: Asset manager migration fix

on:
  push:
    branches: [asset-manager-cleanup]
    paths:
      - '.github/workflows/asset-manager-migrate-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asset-manager-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Correct guarded migration inputs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          {
            const p='scripts/migrate-asset-manager.mjs';
            let s=fs.readFileSync(p,'utf8');
            const clothingFrom="['clothingLayers.js', '  function load(src){', '  function ready(img){',";
            const clothingTo="['clothingLayers.js', '  function load(src){', '  function view(v){',";
            if(!s.includes(clothingFrom)) throw new Error('Expected clothing migration marker not found');
            s=s.replace(clothingFrom,clothingTo);
            const spriteFrom='function loadImage\\(src\\) \\{[\\s\\S]*?\\n\\}\\n(?=\\nfunction )';
            const spriteTo='    function loadImage\\(src\\) \\{[\\s\\S]*?\\n    \\}\\n(?=\\n    function )';
            if(!s.includes(spriteFrom)) throw new Error('Expected sprite migration regex not found');
            fs.writeFileSync(p,s.replace(spriteFrom,spriteTo));
          }
          {
            const p='scenario5ArmourLab.js';
            let s=fs.readFileSync(p,'utf8');
            const from="  function loadImage(src){\n    if(imageCache.has(src))return imageCache.get(src);\n    const promise=new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error(`Failed to load ${src}`));img.src=src;});\n    imageCache.set(src,promise);return promise;\n  }";
            const to="function loadImage(src) {\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n    img.onerror = () => reject(new Error(`Failed to load ${src}`));\n    img.src = src;\n  });\n}";
            if(!s.includes(from)) throw new Error('Expected compact armour lab loader not found');
            fs.writeFileSync(p,s.replace(from,to));
          }
          {
            const p='main.js';
            let s=fs.readFileSync(p,'utf8');
            const loadStart='        function load(asset) {';
            const loadEnd='\n\n        // Re-prioritizable on demand';
            const a=s.indexOf(loadStart), b=s.indexOf(loadEnd,a);
            if(a<0||b<0) throw new Error('Expected nested main preload function not found');
            const normalLoad=[
              'function load(asset) {',
              '    if (_loadedKeys.has(asset.key)) return Promise.resolve();',
              '    _loadedKeys.add(asset.key);',
              '    return new Promise((resolve) => {',
              '        const img = new Image();',
              '        img.onload = () => { window.gameVisuals[asset.key] = img; resolve(); };',
              '        img.onerror = () => { console.warn("Failed:", asset.src); resolve(); };',
              '        img.src = asset.src;',
              '    });',
              '}'
            ].join('\n');
            s=s.slice(0,a)+normalLoad+s.slice(b);
            const previewStart='    function loadAppearancePreviewImage(src) {';
            const previewEnd='\n    window.updateSkinToneControlMode = function() {';
            const c=s.indexOf(previewStart), d=s.indexOf(previewEnd,c);
            if(c<0||d<0) throw new Error('Expected nested appearance preview loader not found');
            const normalPreview=[
              'function loadAppearancePreviewImage(src) {',
              '    let img = _appearancePreviewImages[src];',
              '    if (!img) {',
              '        img = new Image();',
              '        img.onload = () => window.updateAppearancePreview();',
              '        img.src = src;',
              '        _appearancePreviewImages[src] = img;',
              '    }',
              '    return img;',
              '}'
            ].join('\n');
            s=s.slice(0,c)+normalPreview+s.slice(d);
            fs.writeFileSync(p,s);
          }
          NODE
      - name: Apply guarded migration
        run: node scripts/migrate-asset-manager.mjs
      - name: Validate syntax
        run: |
          for f in assetLoadScheduler.js gameEngine.js humanoidRenderer.js main.js pantsVariantFixes.js skirtClothing.js braidDirectionalHair.js clothingLayers.js equipmentInterface.js facingSystem.js npcBuilder.js equipmentAppearance.js directionalPresentationFixes.js shieldAppearance.js scenario5ArmourLab.js spriteRigPreview.js raceSkinPalettes.js renderHotPathCache.js; do
            node --check "$f"
          done
      - run: npm run validate:png
      - run: npm run test:unit
      - name: Remove migration-only files
        run: rm -f asset-manager-audit-trigger.txt scripts/migrate-asset-manager.mjs .github/workflows/asset-manager-migrate.yml .github/workflows/asset-manager-migrate-fix.yml
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: centralise runtime image loading [asset-manager-migrated]'
          git push origin HEAD:asset-manager-cleanup
