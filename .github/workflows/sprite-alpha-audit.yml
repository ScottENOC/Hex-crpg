name: Sprite Alpha Crop Audit

on:
  push:
    branches:
      - development
    paths:
      - 'scripts/audit_sprite_alpha.py'
      - '.github/workflows/sprite-alpha-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install pillow
      - name: Audit PNG alpha bounds
        run: python scripts/audit_sprite_alpha.py
