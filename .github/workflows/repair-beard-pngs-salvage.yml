name: Salvage beard PNGs

on:
  push:
    branches: [repair-beard-pngs]

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Salvage intact PNG rows
        run: |
          node <<'NODE'
          const fs=require('node:fs'), zlib=require('node:zlib');
          const files=['images/characters/facial_hair/beard_full_front.png','images/characters/facial_hair/beard_full_side.png'];
          const sig=Buffer.from([137,80,78,71,13,10,26,10]), iend=Buffer.from([0,0,0,0,73,69,78,68,174,66,96,130]);
          function crc32(b){let c=0xffffffff;for(const v of b){c^=v;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0);}return(c^0xffffffff)>>>0;}
          function paeth(a,b,c){const p=a+b-c,pa=Math.abs(p-a),pb=Math.abs(p-b),pc=Math.abs(p-c);return pa<=pb&&pa<=pc?a:pb<=pc?b:c;}
          function unfilter(f,src,prev){const out=Buffer.alloc(src.length);for(let x=0;x<src.length;x++){const l=x>=4?out[x-4]:0,u=prev?prev[x]:0,ul=prev&&x>=4?prev[x-4]:0;let p=0;if(f===1)p=l;else if(f===2)p=u;else if(f===3)p=Math.floor((l+u)/2);else if(f===4)p=paeth(l,u,ul);else if(f!==0)throw new Error(`filter ${f}`);out[x]=(src[x]+p)&255;}return out;}
          function chunk(t,d){const tb=Buffer.from(t),o=Buffer.alloc(d.length+12);o.writeUInt32BE(d.length,0);tb.copy(o,4);d.copy(o,8);o.writeUInt32BE(crc32(Buffer.concat([tb,d])),8+d.length);return o;}
          for(const file of files){
            const p=fs.readFileSync(file); if(!p.subarray(0,8).equals(sig)||p.toString('ascii',12,16)!=='IHDR'||p.toString('ascii',37,41)!=='IDAT'||!p.subarray(-12).equals(iend))throw new Error(`${file}: unexpected structure`);
            const w=p.readUInt32BE(16),h=p.readUInt32BE(20); if(p[24]!==8||p[25]!==6||p[28]!==0)throw new Error(`${file}: unsupported format`);
            const compressed=p.subarray(41,p.length-16); const cmf=compressed[0],flg=compressed[1]; if((cmf&15)!==8||(((cmf<<8)|flg)%31)!==0||(flg&32))throw new Error(`${file}: bad zlib header`);
            const partial=zlib.inflateRawSync(compressed.subarray(2,-4)), stride=w*4,rowBytes=stride+1, candidate=Math.min(h,Math.floor(partial.length/rowBytes));
            const rows=[];let prev=null,firstBad=-1;
            for(let y=0;y<candidate;y++){const off=y*rowBytes,f=partial[off];if(f>4){firstBad=y;break;}try{const row=unfilter(f,partial.subarray(off+1,off+rowBytes),prev);rows.push(row);prev=row;}catch{firstBad=y;break;}}
            const good=rows.length; if(good<Math.floor(h*.9))throw new Error(`${file}: only ${good}/${h} trustworthy rows (first corrupt row ${firstBad}); refusing salvage`);
            while(rows.length<h)rows.push(Buffer.alloc(stride));
            const raw=Buffer.alloc(h*rowBytes);for(let y=0;y<h;y++){const off=y*rowBytes;raw[off]=0;rows[y].copy(raw,off+1);}const idat=zlib.deflateSync(raw,{level:9});
            const rebuilt=Buffer.concat([sig,p.subarray(8,33),chunk('IDAT',idat),iend]); if(zlib.inflateSync(idat).length!==raw.length)throw new Error(`${file}: rebuilt decode failed`);fs.writeFileSync(file,rebuilt);
            console.log(`${file}: kept ${good}/${h} trustworthy rows; replaced ${h-good} bottom rows transparent`);
          }
          NODE
          npm ci
          npm run validate:png
      - name: Publish validated repairs to development
        run: |
          mkdir -p /tmp/beards
          cp images/characters/facial_hair/beard_full_*.png /tmp/beards/
          git fetch origin development
          git checkout -B development origin/development
          cp /tmp/beards/beard_full_front.png images/characters/facial_hair/beard_full_front.png
          cp /tmp/beards/beard_full_side.png images/characters/facial_hair/beard_full_side.png
          npm ci
          npm run validate:png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/characters/facial_hair/beard_full_front.png images/characters/facial_hair/beard_full_side.png
          git diff --cached --quiet && exit 0
          git commit -m 'Salvage truncated full beard PNGs'
          git pull --rebase origin development
          git push origin HEAD:development
