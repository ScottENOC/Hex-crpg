name: Apply orphaned cache inspector recovery

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-inspector-recovery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply inspector recovery patch
        run: python3 .github/scripts/apply-offline-inspector-recovery.py
      - name: Validate JavaScript and cache bust
        run: |
          node --check offlineCache.js
          grep -q "Active pointer missing; listing local cache names" offlineCache.js
          grep -q "discovered cache manifest (active pointer missing)" offlineCache.js
          grep -q "offlineCache.js?v=15-inspector3" index.html
      - name: Remove temporary patch machinery
        run: rm .github/scripts/apply-offline-inspector-recovery.py .github/workflows/apply-offline-inspector-recovery.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineCache.js index.html .github/scripts/apply-offline-inspector-recovery.py .github/workflows/apply-offline-inspector-recovery.yml
          git commit -m 'Inspect orphaned local caches when metadata is missing'
          git pull --rebase origin development
          git push origin HEAD:development
