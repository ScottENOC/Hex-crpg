name: Character clothing and armour integration
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - run: python3 tools/character_clothing_armour_patch_once.py
      - run: |
          node --check clothingLayers.js
          node --check humanoidRenderer.js
          node --check ui.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add humanoidRenderer.js ui.js
          git commit -m "Add shaped armour and default layered clothing"
          git push origin development
