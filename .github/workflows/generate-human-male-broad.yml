name: Wire human male broad sprites

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/generate-human-male-broad.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 1

      - name: Wire broad sprites and lower the rear sword
        run: |
          python - <<'PY'
          from pathlib import Path
          renderer_path = Path('humanoidRenderer.js')
          renderer = renderer_path.read_text()
          old_male = "        human_male: {\n            body: {\n                average: {\n                    front:'images/characters/human_male/body_front.png',\n                    side:'images/characters/human_male/body_side.png',\n                    back:'images/characters/human_male/body_back.png',\n                },\n            },\n            // Hair choices are shared between genders; the body rig supplies placement.\n            hair:null,\n        },"
          new_male = "        human_male: {\n            body: {\n                average: {\n                    front:'images/characters/human_male/body_front.png',\n                    side:'images/characters/human_male/body_side.png',\n                    back:'images/characters/human_male/body_back.png',\n                },\n                broad: {\n                    front:'images/characters/human_male/body_broad_front.png',\n                    side:'images/characters/human_male/body_broad_side.png',\n                    back:'images/characters/human_male/body_broad_back.png',\n                },\n            },\n            // Hair choices are shared between genders; the body rig supplies placement.\n            hair:null,\n        },"
          if old_male not in renderer:
              raise SystemExit('Expected human_male body-path block not found')
          renderer = renderer.replace(old_male, new_male, 1)
          old_back = "        back:{helmetAnchor:{x:0,y:-.025},armourY:-.010},"
          new_back = "        back:{\n            helmetAnchor:{x:0,y:-.025},\n            armourY:-.010,\n            // Front sword is lowered by .075 at the grip plus .096336564429012\n            // at the held-item layer. Match that total in back view without\n            // moving the measured attachment anchor or changing other weapons.\n            heldItems:{sword:{inward:0,y:.171336564429012}},\n        },"
          if old_back not in renderer:
              raise SystemExit('Expected back equipment-tuning block not found')
          renderer = renderer.replace(old_back, new_back, 1)
          renderer_path.write_text(renderer)
          test_path = Path('tests/human-female-direct-render.spec.js')
          test = test_path.read_text()
          old_ready = "      && male?.body?.average?.front?.naturalWidth > 0;"
          new_ready = "      && male?.body?.average?.front?.naturalWidth > 0\n      && male?.body?.broad?.front?.naturalWidth > 0\n      && male?.body?.broad?.side?.naturalWidth > 0\n      && male?.body?.broad?.back?.naturalWidth > 0;"
          if old_ready not in test:
              raise SystemExit('Expected male renderer-matrix readiness check not found')
          test = test.replace(old_ready, new_ready, 1)
          old_assert = "    expect(rendererSource).toContain(\"helmet:'images/nasalHelm_back.svg'\");"
          new_assert = old_assert + "\n    expect(rendererSource).toContain(\"heldItems:{sword:{inward:0,y:.171336564429012}}\");\n    expect(rendererSource).toContain(\"front:'images/characters/human_male/body_broad_front.png'\");\n    expect(rendererSource).toContain(\"side:'images/characters/human_male/body_broad_side.png'\");\n    expect(rendererSource).toContain(\"back:'images/characters/human_male/body_broad_back.png'\");"
          if old_assert not in test:
              raise SystemExit('Expected renderer source assertion anchor not found')
          test = test.replace(old_assert, new_assert, 1)
          test_path.write_text(test)
          PY

      - name: Remove one-shot generator and commit
        run: |
          git rm .github/workflows/generate-human-male-broad.yml
          git add humanoidRenderer.js tests/human-female-direct-render.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Lower rear sword and wire male broad sprites'
          git push origin HEAD:development
