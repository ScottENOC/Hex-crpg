name: One-off wire shield variants

on:
  push:
    branches:
      - chatgpt/shield-variants-20260930
    paths:
      - '.github/workflows/oneoff-wire-shield-variants.yml'

permissions:
  contents: write

jobs:
  wire-shield-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/shield-variants-20260930
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch shield item visuals and renderer
        run: python .github/scripts/oneoff_wire_shields.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run focused humanoid renderer regression
        run: npx playwright test tests/human-female-direct-render.spec.js --workers=1

      - name: Commit focused shield changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-wire-shield-variants.yml .github/scripts/oneoff_wire_shields.py
          git add equipment.js humanoidRenderer.js tests/human-female-direct-render.spec.js
          git commit -m 'Wire shield variants to directional art [skip ci]'
          git push origin HEAD:chatgpt/shield-variants-20260930
