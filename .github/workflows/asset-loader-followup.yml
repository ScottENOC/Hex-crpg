name: Asset loader follow-up

on:
  push:
    branches: [asset-loader-followup]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded loader cleanup
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          BUILD='20261001-unified-asset-loading-v2'

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_exact(path, old, new, count=1):
              s=read(path)
              actual=s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:100]!r}')
              write(path, s.replace(old,new))

          # One deployed build identity exists before any game script can request art.
          replace_exact('index.html',
              '<meta name="app-build" content="20260928-character-body-assets-v3">',
              f'<meta name="app-build" content="{BUILD}">')
          replace_exact('index.html',
              '''    <!-- Cache-busting: every local script below shares one ?v=N query param.\n         Mobile Safari (regular tabs, not private/incognito) caches these\n         far more aggressively than desktop browsers and won't pick up a\n         changed file just because the server sent a new Last-Modified/ETag\n         — bump this number on every deploy that changes any .js file, or\n         returning players get served stale code until they clear site data. -->''',
              '''    <!-- Cache-busting: local entry scripts carry explicit version query params.\n         Mobile Safari (regular tabs, not private/incognito) caches these\n         far more aggressively than desktop browsers and won't pick up a\n         changed file just because the server sent a new Last-Modified/ETag.\n         Bump the version of each changed static entry script when deploying. -->''')
          replace_exact('index.html','    <script src="assetLoadScheduler.js?v=5"></script>',
              '    <script data-asset-load-scheduler src="assetLoadScheduler.js?v=6"></script>')
          replace_exact('index.html','<script src="data.js?v=6"></script>',
              '    <script src="data.js?v=7"></script>')
          replace_exact('index.html','    <script src="name.js?v=15"></script>',
              '    <script src="name.js?v=16"></script>')
          replace_exact('index.html','    <script src="ui.js?v=5"></script>',
              '    <script src="ui.js?v=6"></script>')
          replace_exact('spriteRigPreview.html','<script src="assetLoadScheduler.js?v=5"></script>',
              '<script data-asset-load-scheduler src="assetLoadScheduler.js?v=6"></script>')

          # data.js is no longer a second scheduler bootstrap path.
          replace_exact('data.js', '''// data.js is the first game script in index.html. Install the asset scheduler\n// synchronously here so every later Image.src assignment is redirected,\n// prioritised and concurrency-limited before any renderer/game code can run.\n// document.write is safe in this narrow parser-time use: this file is loaded by\n// a normal blocking <script> while the document is still being parsed.\nif (!window.__assetLoadSchedulerInstalled) {\n    document.write('<script src="assetLoadScheduler.js?v=3"><\\/script>');\n}\n''', '''// assetLoadScheduler.js is loaded explicitly by index.html before data.js.\n// Standalone harnesses that need managed art must load the scheduler explicitly too.\n''')

          # The app-build meta tag is authoritative from parser time onwards.
          replace_exact('name.js',
              "const PRESENTATION_BUILD = '20260930-shared-asset-manager-v1';",
              "const PRESENTATION_BUILD = document.querySelector('meta[name=\"app-build\"]')?.content || 'unversioned-dev-build';")
          replace_exact('name.js',
              'const presentationBuildMeta=document.querySelector(\'meta[name="app-build"]\');if(presentationBuildMeta)presentationBuildMeta.content=PRESENTATION_BUILD;\n',
              '')
          replace_exact('name.js',
              '''async function fetchRemotePresentationBuild(){const response=await fetch(`name.js?app-update-check=${Date.now()}`,{cache:'no-store'});if(!response.ok)return null;const source=await response.text();const match=source.match(/const\\s+PRESENTATION_BUILD\\s*=\\s*['\\"]([^'\\"]+)['\\"]/);return match?.[1]||null;}''',
              '''async function fetchRemotePresentationBuild(){const response=await fetch(`index.html?app-update-check=${Date.now()}`,{cache:'no-store'});if(!response.ok)return null;const source=await response.text();const match=source.match(/<meta\\s+name=["']app-build["']\\s+content=["']([^"']+)["']/i);return match?.[1]||null;}''')
          replace_exact('name.js',
              '''        // assetLoadScheduler.js is installed synchronously by data.js before any\n        // other game script. Do not request it a second time here.''',
              '''        // assetLoadScheduler.js is an explicit parser-time entry in index.html,\n        // before data.js and all dynamically installed render modules.''')

          # Asset manager remains the only owner of network/retry work, including DOM <img> consumers.
          replace_exact('assetLoadScheduler.js',"    const SCHEDULER_VERSION = '5';","    const SCHEDULER_VERSION = '6';")
          replace_exact('assetLoadScheduler.js',
              '''    function currentBuild() {\n        return window.PRESENTATION_BUILD || document.querySelector('meta[name="app-build"]')?.content || 'asset-manager-v4';\n    }''',
              '''    function currentBuild() {\n        return document.querySelector('meta[name="app-build"]')?.content || window.PRESENTATION_BUILD || 'asset-manager-v6';\n    }''')
          replace_exact('assetLoadScheduler.js','    const managerRecords = new Map();',
              '    const managerRecords = new Map();\n    const domBindingTokens = new WeakMap();')
          replace_exact('assetLoadScheduler.js',
              '''    function whenReady(value,opts={}) {\n        return loadManaged(value,opts);\n    }\n\n    async function preloadManaged(values,opts={}) {''',
              '''    function whenReady(value,opts={}) {\n        return loadManaged(value,opts);\n    }\n\n    function bindManagedElement(element,value,{priority=-20,onError=null}={}) {\n        if (!(element instanceof HTMLImageElement)) throw new TypeError('assetManager.bind expects an HTMLImageElement');\n        if (!value) return element;\n        const token=Symbol('managed-dom-image');\n        domBindingTokens.set(element,token);\n        element.dataset.assetManagerPath=canonicalPath(value);\n        loadManaged(value,{priority,immediate:true}).then(source=>{\n            if(domBindingTokens.get(element)!==token)return;\n            const resolved=source.currentSrc || nativeSrc.get.call(source);\n            if(resolved) nativeSrc.set.call(element,resolved);\n        }).catch(error=>{\n            if(domBindingTokens.get(element)!==token)return;\n            element.removeAttribute('src');\n            if(typeof onError==='function')onError(error,element);\n        });\n        return element;\n    }\n\n    function createManagedDOMImage(value=null,opts={}) {\n        const element=document.createElement('img');\n        if(value)bindManagedElement(element,value,opts);\n        return element;\n    }\n\n    async function preloadManaged(values,opts={}) {''')
          replace_exact('assetLoadScheduler.js',
              '''        whenReady,\n        preload:preloadManaged,''',
              '''        whenReady,\n        bind:bindManagedElement,\n        createDOMImage:createManagedDOMImage,\n        preload:preloadManaged,''')

          # Inventory icons use the same manager and retry path as canvas/render assets.
          replace_exact('equipmentInterface.js',"    const img=document.createElement('img');","    const img=window.assetManager.createDOMImage();")
          replace_exact('equipmentInterface.js',
              '    img.src=`${path}?build=${encodeURIComponent(BUILD)}`;',
              '    window.assetManager.bind(img,path,{priority:-20,onError:()=>img.onerror?.()});')

          # Turn-order and conversation portraits were the remaining independent image request path.
          ui=read('ui.js')
          created=ui.count("document.createElement('img')")
          if created != 13:
              raise SystemExit(f'ui.js: expected 13 DOM img constructors, found {created}')
          ui=ui.replace("document.createElement('img')","window.assetManager.createDOMImage()")
          path_map={
              'images/humanmale.png':'images/characters/human_male/body_front.png',
              'images/humanfemale.png':'images/characters/human_female/body_front.png',
              'images/humanfemalehair.png':'images/characters/human_female/hair_brown_1_front.png',
              'images/humanmalehair.png':'images/characters/human_female/hair_brown_1_front.png',
              'images/nasalHelm.png':'images/equipment/helmets/nasal_helm.png',
              'images/humanlightarmour.png':'images/equipment/armour/human/light.png',
              'images/humanmediumarmour.png':'images/equipment/armour/human/medium.png',
              'images/humanheavyarmour.png':'images/equipment/armour/human/heavy.png',
              'images/elfmale.png':'images/characters/legacy/elf_male/body.png',
              'images/elffemale.png':'images/characters/elf_female/body_front.png',
              'images/dwarfmale.png':'images/characters/legacy/dwarf_male/body.png',
              'images/dwarffemale.png':'images/characters/legacy/dwarf_female/body.png',
              'images/orc.png':'images/characters/creatures/orc.png',
              'images/elf.png':'images/characters/legacy/elf_male/body.png',
              'images/elffemalehair.png':'images/characters/human_female/hair_brown_1_front.png',
              'images/elfmalehair.png':'images/characters/legacy/elf_male/hair.png',
              'images/dwarfmalehair.png':'images/characters/legacy/dwarf_male/hair.png',
              'images/dwarffemalehair.png':'images/characters/legacy/dwarf_female/hair.png',
              'images/shield.png':'images/equipment/shields/round.png',
              'images/wolf.png':'images/characters/creatures/wolf.png',
              'images/horse.png':'images/characters/creatures/horse.png',
              'images/skeleton.svg':'images/characters/creatures/skeleton.svg',
              'images/zombie.svg':'images/characters/creatures/zombie.svg',
              'images/imp.svg':'images/characters/creatures/imp.svg',
              'images/boar.png':'images/characters/creatures/boar.png',
              'images/tiger.png':'images/characters/creatures/tiger.png',
              'images/troll.png':'images/characters/creatures/troll.png',
              'images/eagleflying.png':'images/characters/creatures/eagle_flying.png',
              'images/eagle.png':'images/characters/creatures/eagle.png',
              'images/goblin.png':'images/characters/creatures/goblin.png',
          }
          for old,new in path_map.items():
              ui=ui.replace(old,new)
          image_vars='baseImg|hairImg|helmImg|armorImg|shieldImg|horseImg|img'
          assignment=re.compile(rf'\\b({image_vars})\\.src\\s*=\\s*([^;\\n]+);')
          matches=list(assignment.finditer(ui))
          if len(matches) < 20:
              raise SystemExit(f'ui.js: expected many direct portrait src assignments, found only {len(matches)}')
          ui=assignment.sub(lambda m:f"window.assetManager.bind({m.group(1)}, {m.group(2)}, {{priority:-20}});",ui)
          ui=ui.replace('if (hairImg.src) {','if (hairImg.dataset.assetManagerPath) {')
          if re.search(rf'\\b({image_vars})\\.src\\s*=',ui):
              raise SystemExit('ui.js: direct portrait img.src assignment remains')
          if "document.createElement('img')" in ui or 'document.createElement("img")' in ui:
              raise SystemExit('ui.js: unmanaged DOM img construction remains')
          for obsolete in ('images/humanfemale.png','images/humanmale.png','images/humanfemalehair.png','images/humanmalehair.png','images/elf.png'):
              if obsolete in ui:
                  raise SystemExit(f'ui.js: obsolete portrait path remains: {obsolete}')
          write('ui.js',ui)

          # Stronger architecture guard: all image elements, including DOM portraits, originate in the manager.
          write('tests-unit/asset-manager-coverage.test.js', r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const ROOT = path.resolve(__dirname, '..');
          const SKIP_DIRS = new Set(['.git','node_modules','tests','tests-unit','test-results','playwright-report','appstore']);
          const SKIP_FILES = new Set(['assetLoadScheduler.js']);
          const CONSTRUCTOR_PATTERNS = [
            /\bnew\s+(?:window\.)?Image\s*\(/,
            /document\.createElement\s*\(\s*['"]img['"]\s*\)/i,
          ];

          function walk(dir, out = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (!SKIP_DIRS.has(entry.name)) walk(path.join(dir, entry.name), out);
                continue;
              }
              if (entry.isFile() && entry.name.endsWith('.js')) out.push(path.join(dir, entry.name));
            }
            return out;
          }

          test('runtime image elements are constructed through the shared asset manager', () => {
            const offenders = [];
            for (const file of walk(ROOT)) {
              const rel = path.relative(ROOT, file).replaceAll('\\', '/');
              if (SKIP_FILES.has(rel)) continue;
              const source = fs.readFileSync(file, 'utf8');
              source.split(/\r?\n/).forEach((line, index) => {
                if (CONSTRUCTOR_PATTERNS.some(pattern => pattern.test(line))) offenders.push(`${rel}:${index + 1}: ${line.trim()}`);
              });
              const managedVars = [...source.matchAll(/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:window\.)?assetManager\.createDOMImage\s*\(/g)].map(match => match[1]);
              for (const variable of new Set(managedVars)) {
                const directSrc = new RegExp(`\\b${variable}\\.src\\s*=`);
                source.split(/\r?\n/).forEach((line, index) => {
                  if (directSrc.test(line)) offenders.push(`${rel}:${index + 1}: direct src assignment on managed DOM image: ${line.trim()}`);
                });
              }
            }
            assert.deepEqual(offenders, [], `Unmanaged image loading remains:\n${offenders.join('\n')}`);
          });

          test('the asset manager has one explicit parser-time bootstrap', () => {
            const scheduler = fs.readFileSync(path.join(ROOT, 'assetLoadScheduler.js'), 'utf8');
            const index = fs.readFileSync(path.join(ROOT, 'index.html'), 'utf8');
            const data = fs.readFileSync(path.join(ROOT, 'data.js'), 'utf8');
            const preview = fs.readFileSync(path.join(ROOT, 'spriteRigPreview.html'), 'utf8');
            const version = scheduler.match(/const SCHEDULER_VERSION = '([^']+)'/)?.[1];
            assert.ok(version, 'scheduler version missing');
            assert.ok(index.includes(`data-asset-load-scheduler src="assetLoadScheduler.js?v=${version}"`));
            assert.ok(preview.includes(`data-asset-load-scheduler src="assetLoadScheduler.js?v=${version}"`));
            assert.ok(index.indexOf('assetLoadScheduler.js') < index.indexOf('data.js'));
            assert.ok(!data.includes('assetLoadScheduler.js'), 'data.js must not install the scheduler itself');
          });
          '''.replace(/^          /gm,''))

          # Tests now describe the meta-driven build identity and actual entry-script versioning.
          app=read('tests/app-update.spec.js')
          app=app.replace("await page.route('**/name.js?app-update-check=*', route => route.fulfill({", "await page.route('**/index.html?app-update-check=*', route => route.fulfill({")
          app=app.replace("contentType:'application/javascript',\n            body:\"const PRESENTATION_BUILD = 'future-build';\",", "contentType:'text/html',\n            body:'<meta name=\"app-build\" content=\"future-build\">',")
          if 'name.js?app-update-check' in app: raise SystemExit('app-update test still expects name.js update source')
          write('tests/app-update.spec.js',app)

          sched=read('tests/asset-load-scheduler.spec.js')
          sched=sched.replace('presentationBuild:window.PRESENTATION_BUILD,','presentationBuild:window.PRESENTATION_BUILD,\n        schedulerVersion:scheduler.version,')
          sched=sched.replace("    expect(state.scriptSrc).toMatch(/assetLoadScheduler\\.js\\?build=[^&]+/);", "    const scriptUrl = new URL(state.scriptSrc);\n    expect(scriptUrl.pathname).toMatch(/assetLoadScheduler\\.js$/);\n    expect(scriptUrl.searchParams.get('v')).toBe(state.schedulerVersion);")
          write('tests/asset-load-scheduler.spec.js',sched)

          hot=read('tests-unit/render-hot-path-cache.test.js')
          hot=hot.replace("  const name = read('name.js');\n  assert.match(name, /const PRESENTATION_BUILD = '[^']+';/);", "  const name = read('name.js');\n  const index = read('index.html');\n  assert.match(index, /<meta name=\"app-build\" content=\"\\d{8}-[a-z0-9-]+\">/);\n  assert.ok(name.includes('document.querySelector(\\'meta[name=\"app-build\"]\\')?.content'));")
          write('tests-unit/render-hot-path-cache.test.js',hot)

          clothing=read('tests-unit/clothing-render-regression.test.js')
          clothing=clothing.replace("    assert.match(nameSource, /const PRESENTATION_BUILD = '[^']+';/);", "    contains(indexSource, '<meta name=\"app-build\" content=\"');\n    contains(nameSource, 'document.querySelector(\\'meta[name=\"app-build\"]\\')?.content');")
          write('tests-unit/clothing-render-regression.test.js',clothing)

          # Final static checks before tests.
          for path in ('assetLoadScheduler.js','data.js','name.js','ui.js','equipmentInterface.js'):
              source=read(path)
              if path!='assetLoadScheduler.js' and re.search(r'\\bnew\\s+(?:window\\.)?Image\\s*\\(',source):
                  raise SystemExit(f'{path}: unmanaged Image constructor remains')
              if path not in ('assetLoadScheduler.js',) and re.search(r'document\\.createElement\\s*\\(\\s*[\'\"]img[\'\"]\\s*\\)',source,re.I):
                  raise SystemExit(f'{path}: unmanaged DOM img constructor remains')
          print('Guarded loader cleanup applied.')
          PY
      - name: JavaScript syntax checks
        run: |
          node --check assetLoadScheduler.js
          node --check data.js
          node --check name.js
          node --check ui.js
          node --check equipmentInterface.js
      - name: Install dependencies
        run: npm ci
      - name: Validate PNG assets
        run: npm run validate:png
      - name: Run fast Node tests
        run: npm run test:unit
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run focused loader tests
        run: npx playwright test tests/asset-load-scheduler.spec.js tests/app-update.spec.js
      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/asset-loader-followup.yml
          git add index.html spriteRigPreview.html assetLoadScheduler.js data.js name.js ui.js equipmentInterface.js tests-unit/asset-manager-coverage.test.js tests-unit/render-hot-path-cache.test.js tests-unit/clothing-render-regression.test.js tests/app-update.spec.js tests/asset-load-scheduler.spec.js
          git diff --cached --check
          git commit -m "Tighten unified asset loading"
          git push origin HEAD:asset-loader-followup
