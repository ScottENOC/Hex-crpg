name: Asset manager baseline check

on:
  push:
    branches: [asset-manager-baseline-check]

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run suspicious baseline tests
        run: npx playwright test tests/silverhart-capital-rebuild.spec.js tests/villain-path-economy.spec.js
