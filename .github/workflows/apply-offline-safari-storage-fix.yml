name: Apply Safari storage preservation fix

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/apply-offline-safari-storage-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development

      - name: Apply Safari storage preservation fix
        run: python3 .github/scripts/apply-offline-safari-storage-fix.py

      - name: Validate change
        run: |
          node --check offlineCache.js
          grep -q "must also never unregister workers or delete hex-game-" offlineCache.js
          if grep -A8 "if (!isStandaloneWebApp())" offlineCache.js | grep -q "cleanupSafariOfflineControl"; then
            echo "startup still calls destructive Safari cleanup"
            exit 1
          fi
          grep -q "offlineCache.js?v=15-safari-storage-fix" index.html

      - name: Remove temporary patch machinery
        run: rm .github/scripts/apply-offline-safari-storage-fix.py .github/workflows/apply-offline-safari-storage-fix.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineCache.js index.html .github/scripts/apply-offline-safari-storage-fix.py .github/workflows/apply-offline-safari-storage-fix.yml
          git commit -m 'Do not let Safari erase the installed offline copy'
          git pull --rebase origin development
          git push origin HEAD:development
