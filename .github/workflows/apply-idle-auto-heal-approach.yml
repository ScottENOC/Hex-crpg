name: Apply Auto Heal approach

on:
  push:
    branches: [feature/idle-auto-heal-approach]
    paths:
      - '.github/workflows/apply-idle-auto-heal-approach.yml'
      - 'scripts/apply-idle-auto-heal-approach.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/idle-auto-heal-approach
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: python3 scripts/apply-idle-auto-heal-approach.py

      - name: Normalise VM object assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests-unit/idle-auto-heal.test.js')
          s = p.read_text()
          s = s.replace(
              "    assert.deepEqual(action.approachDestination, { q: 5, r: 0 });",
              "    assert.equal(action.approachDestination.q, 5);\n    assert.equal(action.approachDestination.r, 0);"
          )
          s = s.replace(
              "    assert.deepEqual(caster.destination, { q: 5, r: 0 });",
              "    assert.equal(caster.destination.q, 5);\n    assert.equal(caster.destination.r, 0);"
          )
          p.write_text(s)
          PY

      - name: Focused checks
        id: focused
        continue-on-error: true
        run: |
          set +e
          node --check spellPlanner.js > auto-heal-test-output.txt 2>&1
          CHECK_STATUS=$?
          node --test tests-unit/idle-auto-heal.test.js >> auto-heal-test-output.txt 2>&1
          TEST_STATUS=$?
          cat auto-heal-test-output.txt
          if [ "$CHECK_STATUS" -ne 0 ] || [ "$TEST_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Preserve failure output
        if: steps.focused.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-heal-test-output.txt
          git commit -m "Capture Auto Heal approach test failure"
          git push origin feature/idle-auto-heal-approach

      - name: Commit implementation and remove one-off patcher
        if: steps.focused.outcome == 'success'
        run: |
          rm -f scripts/apply-idle-auto-heal-approach.py .github/workflows/apply-idle-auto-heal-approach.yml auto-heal-test-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spellPlanner.js tests-unit/idle-auto-heal.test.js index.html scripts/apply-idle-auto-heal-approach.py .github/workflows/apply-idle-auto-heal-approach.yml auto-heal-test-output.txt
          git commit -m "Let idle healers approach nearby allies"
          git push origin feature/idle-auto-heal-approach
