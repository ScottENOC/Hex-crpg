name: Anchor calibration smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'rigDebug.js'
      - 'tests/human-female-anchor-calibration.spec.js'
      - 'tests/human-female-anchor-calibration-static.spec.js'
      - '.github/workflows/anchor-smoke.yml'

jobs:
  anchor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run anchor calibration regressions
        run: npx playwright test tests/rig-debug.spec.js tests/human-female-anchor-calibration.spec.js tests/human-female-anchor-calibration-static.spec.js --project=chromium