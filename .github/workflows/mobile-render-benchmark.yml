name: Mobile Render Benchmark

on:
  push:
    branches:
      - perf/mobile-render-pass

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/mobile-render-benchmark.spec.js --reporter=line --workers=1
