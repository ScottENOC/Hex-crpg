name: Normalise gameplay image dimensions

on:
  push:
    branches: [development]
    paths:
      - ".github/normalise-gameplay-images.trigger"

permissions:
  contents: write

jobs:
  normalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Resize raster gameplay assets
        shell: bash
        run: |
          set -euo pipefail
          find images/characters images/equipment \
            -type f \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            case "$file" in
              *.png|*.PNG)
                convert "$file" -resize '512x512>' -strip -depth 8 -define png:compression-level=9 \
                  -define png:compression-filter=5 -define png:compression-strategy=1 "$file"
                ;;
              *.webp|*.WEBP)
                convert "$file" -resize '512x512>' -strip -depth 8 -define webp:lossless=true "$file"
                ;;
              *.jpg|*.JPG|*.jpeg|*.JPEG)
                convert "$file" -resize '512x512>' -strip -quality 90 "$file"
                ;;
            esac
          done

      - name: Commit normalised images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/characters images/equipment
          if git diff --cached --quiet; then
            echo "No raster assets needed resizing."
            exit 0
          fi
          git commit -m "Normalise gameplay image dimensions"
          git push origin development
