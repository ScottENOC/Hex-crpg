name: One-off kite shield asset cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/oneoff-fix-kite-shield.yml'

permissions:
  contents: write

jobs:
  clean-kite-shield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Clean front image and generate matching back
        shell: bash
        run: |
          cat > /tmp/fix_kite.py <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          from PIL import Image, ImageChops, ImageDraw, ImageFilter
          from scipy import ndimage

          SRC = Path('images/equipment/shields/kite.png')
          OUT = Path('kite-shield-output')
          OUT.mkdir(exist_ok=True)

          image = Image.open(SRC).convert('RGBA')
          arr = np.asarray(image).copy()
          h, w = arr.shape[:2]
          rgb = arr[..., :3].astype(np.int16)
          original_alpha = arr[..., 3]

          # Learn the apparent background from a narrow border strip. Several
          # pale checker colours can all represent the same fake transparency.
          strip = max(2, min(w, h) // 100)
          border = np.concatenate([
              rgb[:strip].reshape(-1, 3), rgb[-strip:].reshape(-1, 3),
              rgb[:, :strip].reshape(-1, 3), rgb[:, -strip:].reshape(-1, 3),
          ])
          quant = ((border // 8) * 8).astype(np.uint8)
          colours, counts = np.unique(quant, axis=0, return_counts=True)
          order = np.argsort(counts)[::-1]
          total = counts.sum()
          palette = []
          covered = 0
          for idx in order[:24]:
              palette.append(colours[idx].astype(np.int16))
              covered += int(counts[idx])
              if covered >= total * 0.96 and len(palette) >= 2:
                  break
          palette = np.stack(palette)

          min_dist2 = np.full((h, w), 1 << 30, dtype=np.int32)
          for colour in palette:
              d = rgb - colour
              dist2 = np.sum(d * d, axis=2, dtype=np.int32)
              np.minimum(min_dist2, dist2, out=min_dist2)
          candidate_bg = (min_dist2 <= 34 * 34) | (original_alpha <= 8)

          # Only erase candidate background connected to the canvas edge.
          bg_labels, _ = ndimage.label(candidate_bg, structure=np.ones((3, 3), dtype=np.uint8))
          edge_labels = np.unique(np.concatenate([
              bg_labels[0], bg_labels[-1], bg_labels[:, 0], bg_labels[:, -1]
          ]))
          edge_labels = edge_labels[edge_labels != 0]
          background = np.isin(bg_labels, edge_labels)

          # Keep the largest connected opaque component. This drops any tiny
          # checker artefacts without erasing similarly coloured shield detail.
          rough_fg = (~background) & (original_alpha > 8)
          labels, count = ndimage.label(rough_fg, structure=np.ones((3, 3), dtype=np.uint8))
          if count == 0:
              raise RuntimeError('No foreground component found in kite.png')
          sizes = np.bincount(labels.ravel())
          sizes[0] = 0
          largest = int(np.argmax(sizes))
          foreground = labels == largest
          ys, xs = np.where(foreground)
          if not len(xs):
              raise RuntimeError('Foreground segmentation was empty')
          x0, x1 = int(xs.min()), int(xs.max()) + 1
          y0, y1 = int(ys.min()), int(ys.max()) + 1
          foreground_fraction = float(foreground.mean())
          bbox_fraction = float(((x1-x0)*(y1-y0))/(w*h))
          if not (0.03 <= foreground_fraction <= 0.80 and bbox_fraction <= 0.90):
              raise RuntimeError(f'Implausible segmentation: foreground={foreground_fraction:.3f}, bbox={bbox_fraction:.3f}')

          arr[..., 3] = np.where(foreground, original_alpha, 0).astype(np.uint8)
          cleaned = Image.fromarray(arr, 'RGBA')
          margin = max(4, round(max(x1-x0, y1-y0) * 0.015))
          crop_box = (
              max(0, x0-margin), max(0, y0-margin),
              min(w, x1+margin), min(h, y1+margin),
          )
          cleaned = cleaned.crop(crop_box)
          cleaned.save(OUT / 'kite.png', optimize=True)

          # Rear art uses the exact cleaned front silhouette, so the front and
          # back occupy identical bounds. Visual language follows round_back.svg:
          # warm wood, dark iron rim, leather retaining straps and rivets.
          cw, ch = cleaned.size
          alpha = cleaned.getchannel('A')
          yy, xx = np.mgrid[0:ch, 0:cw]
          rng = np.random.default_rng(9)
          grain = rng.normal(0, 5, size=(ch, cw))
          shade = 1.0 - 0.22*(yy/max(1,ch-1)) + 0.06*(1 - np.abs(xx-cw/2)/max(1,cw/2))
          wood = np.empty((ch, cw, 4), dtype=np.uint8)
          base = np.array([112, 70, 42], dtype=np.float32)
          wood_rgb = np.clip(base[None,None,:] * shade[...,None] + grain[...,None], 0, 255)
          wood[..., :3] = wood_rgb.astype(np.uint8)
          wood[..., 3] = np.asarray(alpha)
          back = Image.fromarray(wood, 'RGBA')

          detail = Image.new('RGBA', (cw, ch), (0,0,0,0))
          draw = ImageDraw.Draw(detail)
          for frac in (0.22, 0.39, 0.57, 0.74):
              x = round(cw*frac)
              draw.line((x, round(ch*.06), x, round(ch*.94)), fill=(57,34,24,150), width=max(2, cw//180))
              draw.line((x+max(2,cw//160), round(ch*.06), x+max(2,cw//160), round(ch*.94)), fill=(179,119,72,55), width=max(1,cw//320))
          detail.putalpha(ImageChops.multiply(detail.getchannel('A'), alpha))
          back = Image.alpha_composite(back, detail)

          solid = alpha.point(lambda p: 255 if p >= 24 else 0)
          k = max(3, (round(min(cw,ch)*0.045) | 1))
          eroded = solid.filter(ImageFilter.MinFilter(k))
          rim = ImageChops.subtract(solid, eroded)
          rim_layer = Image.new('RGBA', (cw,ch), (75,80,82,0))
          rim_layer.putalpha(ImageChops.multiply(rim, alpha))
          back = Image.alpha_composite(back, rim_layer)

          straps = Image.new('RGBA', (cw,ch), (0,0,0,0))
          sd = ImageDraw.Draw(straps)
          leather = (84,53,35,235)
          leather_edge = (40,27,19,245)
          for left, top, right, bottom in [(.17,.34,.83,.43), (.25,.57,.76,.655)]:
              box=(round(cw*left),round(ch*top),round(cw*right),round(ch*bottom))
              radius=max(3, round((box[3]-box[1])*.28))
              sd.rounded_rectangle(box, radius=radius, fill=leather, outline=leather_edge, width=max(2,cw//180))
              ry=(box[1]+box[3])//2
              for rx in (box[0]+round((box[2]-box[0])*.08), box[2]-round((box[2]-box[0])*.08)):
                  rr=max(3,round(min(cw,ch)*.009))
                  sd.ellipse((rx-rr,ry-rr,rx+rr,ry+rr), fill=(111,116,116,255), outline=(31,34,35,255), width=max(1,cw//320))
          straps.putalpha(ImageChops.multiply(straps.getchannel('A'), alpha))
          back = Image.alpha_composite(back, straps)
          back.putalpha(alpha)
          back.save(OUT / 'kite_back.png', optimize=True)

          report = {
              'source_dimensions': [w, h],
              'crop_box': list(crop_box),
              'output_dimensions': [cw, ch],
              'foreground_fraction_of_source': round(foreground_fraction, 5),
              'foreground_bbox_fraction_of_source': round(bbox_fraction, 5),
              'transparent_pixels_before': int(np.sum(original_alpha == 0)),
              'transparent_pixels_after_crop': int(np.sum(np.asarray(cleaned.getchannel('A')) == 0)),
              'background_palette': [c.tolist() for c in palette],
          }
          (OUT / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          python /tmp/fix_kite.py
      - name: Commit repaired assets
        shell: bash
        run: |
          cp kite-shield-output/kite.png images/equipment/shields/kite.png
          cp kite-shield-output/kite_back.png images/equipment/shields/kite_back.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/equipment/shields/kite.png images/equipment/shields/kite_back.png
          if ! git diff --cached --quiet; then
            git commit -m 'Fix kite shield transparency, crop and rear art [skip ci]'
            git push origin HEAD:development
          fi
      - name: Upload repaired assets
        uses: actions/upload-artifact@v4
        with:
          name: fixed-kite-shield-assets
          path: kite-shield-output/
          if-no-files-found: error
          retention-days: 1
