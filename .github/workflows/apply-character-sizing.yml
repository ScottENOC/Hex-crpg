name: Apply character sizing tuning

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-character-sizing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Apply narrow renderer and clothing tuning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {found}: {old!r}')
              p.write_text(text.replace(old, new))

          # Armour: 2% of body height farther at both collar and toe ends.
          replace_exact('humanoidRenderer.js',
              """    const ARMOUR_TARGETS = {\n        front:{x:.03,y:.225,w:.94,h:.770},\n        side: {x:.18,y:.225,w:.64,h:.770},\n        // Rear-specific art should occupy the same visible envelope as front art.\n        back: {x:.03,y:.225,w:.94,h:.770},\n    };""",
              """    const ARMOUR_TARGETS = {\n        // Slightly taller than the old .225-.995 envelope: cover collarbones\n        // and toes without changing the approved widths or body-shape profile.\n        front:{x:.03,y:.205,w:.94,h:.810},\n        side: {x:.18,y:.205,w:.64,h:.810},\n        // Rear-specific art should occupy the same visible envelope as front art.\n        back: {x:.03,y:.205,w:.94,h:.810},\n    };""")

          # Clothing: match the armour's added top/bottom coverage while keeping
          # the shirt/pants waist seam fixed at .5715.
          replace_exact('clothingLayers.js', "const BUILD='20260928-clothing-layers-v10';", "const BUILD='20260928-clothing-layers-v11';")
          replace_exact('clothingLayers.js',
              "shirt:{x:.077,y:.225,w:.846,h:.3465},pants:{x:.077,y:.5715,w:.846,h:.4235},dress:{x:.077,y:.225,w:.846,h:.770},",
              "shirt:{x:.077,y:.205,w:.846,h:.3665},pants:{x:.077,y:.5715,w:.846,h:.4435},dress:{x:.077,y:.205,w:.846,h:.810},",
              2)
          replace_exact('clothingLayers.js',
              "shirt:{x:.212,y:.225,w:.576,h:.3465},pants:{x:.212,y:.5715,w:.576,h:.4235},dress:{x:.212,y:.225,w:.576,h:.770},",
              "shirt:{x:.212,y:.205,w:.576,h:.3665},pants:{x:.212,y:.5715,w:.576,h:.4435},dress:{x:.212,y:.205,w:.576,h:.810},")

          replace_exact('clothingLayers.js',
              "const images=new Map(), tinted=new Map();\n  const opaqueBoundsCache=new WeakMap(), toneBoundsCache=new WeakMap();",
              "const images=new Map(), tinted=new Map();\n  const opaqueBoundsCache=new WeakMap(), toneBoundsCache=new WeakMap();\n  const undergarmentFitMetrics=new WeakMap();")

          replace_exact('clothingLayers.js',
              """  function drawFittedGarment(ctx,source,trim,target,bounds,slot){\n    if(!trim?.w||!trim?.h)return false;\n    const targetX=bounds.left+target.x*bounds.width,targetY=bounds.top+target.y*bounds.height;\n    const targetW=target.w*bounds.width,targetH=target.h*bounds.height;\n    const scale=Math.min(targetW/trim.w,targetH/trim.h);\n    const dw=trim.w*scale,dh=trim.h*scale,dx=targetX+(targetW-dw)/2;\n    // Tops sit on the waist seam, pants begin at it; compact undergarments are\n    // centred in their torso/pelvis envelopes so source padding cannot make them huge.\n    const dy=slot==='shirt'?targetY+(targetH-dh):(slot==='pants'?targetY:targetY+(targetH-dh)/2);\n    ctx.drawImage(source,trim.x,trim.y,trim.w,trim.h,dx,dy,dw,dh);\n    return true;\n  }""",
              """  function drawFittedGarment(ctx,source,trim,target,bounds,slot,entity){\n    if(!trim?.w||!trim?.h)return false;\n    const targetX=bounds.left+target.x*bounds.width,targetY=bounds.top+target.y*bounds.height;\n    const targetW=target.w*bounds.width,targetH=target.h*bounds.height;\n    const scale=Math.min(targetW/trim.w,targetH/trim.h);\n    let dw=trim.w*scale,dh=trim.h*scale,dx=targetX+(targetW-dw)/2;\n    // Tops sit on the waist seam, pants begin at it; compact undergarments are\n    // centred in their torso/pelvis envelopes so source padding cannot make them huge.\n    let dy=slot==='shirt'?targetY+(targetH-dh):(slot==='pants'?targetY:targetY+(targetH-dh)/2);\n    if(slot==='underwear'){\n      const briefsRise=dh/3,oldWidth=dw;\n      dw*=1.10;\n      dx-=(dw-oldWidth)/2;\n      dy-=briefsRise;\n      if(entity) undergarmentFitMetrics.set(entity,{briefsRise});\n    }else if(slot==='bra'){\n      // Tie the bra adjustment to the briefs' actual fitted opaque height.\n      // drawDirectionalHumanoidInBounds always paints underwear immediately before bra.\n      const briefsRise=undergarmentFitMetrics.get(entity)?.briefsRise ?? dh/3;\n      dy-=briefsRise*1.8;\n    }\n    ctx.drawImage(source,trim.x,trim.y,trim.w,trim.h,dx,dy,dw,dh);\n    return true;\n  }""")

          replace_exact('clothingLayers.js',
              "if(target) drew=drawFittedGarment(ctx,rendered,trim,target,bounds,slot)||drew;",
              "if(target) drew=drawFittedGarment(ctx,rendered,trim,target,bounds,slot,e)||drew;")

          # Cache chain: every changed layer gets a fresh parent URL on iOS/Safari.
          replace_exact('name.js',
              "const PRESENTATION_BUILD = '20260928-character-visibility-clothing-v1';",
              "const PRESENTATION_BUILD = '20260928-character-sizing-v2';")
          replace_exact('clothingSystem.js', "const BUILD='20260928-clothing-v6';", "const BUILD='20260928-clothing-v7';")
          replace_exact('characterCreation.js',
              "clothingScript.src = 'clothingSystem.js?build=20260928-clothing-v6';",
              "clothingScript.src = 'clothingSystem.js?build=20260928-clothing-v7';")
          replace_exact('index.html', '<meta name="app-build" content="20260925-directional-sprite-refresh">', '<meta name="app-build" content="20260928-character-sizing-v2">')
          replace_exact('index.html', '<script src="name.js?v=12"></script>', '<script src="name.js?v=13"></script>')
          replace_exact('index.html', '<script src="characterCreation.js?v=6"></script>', '<script src="characterCreation.js?v=7"></script>')
          PY

      - name: Verify syntax and requested geometry
        shell: bash
        run: |
          node --check humanoidRenderer.js
          node --check clothingLayers.js
          node --check clothingSystem.js
          node --check name.js
          node --check characterCreation.js
          python - <<'PY'
          from pathlib import Path
          r=Path('humanoidRenderer.js').read_text()
          c=Path('clothingLayers.js').read_text()
          i=Path('index.html').read_text()
          checks=[
            ("front:{x:.03,y:.205,w:.94,h:.810}" in r,'front armour envelope'),
            ("side: {x:.18,y:.205,w:.64,h:.810}" in r,'side armour envelope'),
            ("shirt:{x:.077,y:.205,w:.846,h:.3665}" in c,'shirt top extension'),
            ("pants:{x:.077,y:.5715,w:.846,h:.4435}" in c,'pants bottom extension'),
            ("dress:{x:.077,y:.205,w:.846,h:.810}" in c,'dress envelope'),
            ("const briefsRise=dh/3,oldWidth=dw;" in c,'briefs one-third rise'),
            ("dw*=1.10;" in c,'briefs ten-percent width'),
            ("dy-=briefsRise*1.8;" in c,'bra 1.8x briefs rise'),
            ('name.js?v=13' in i and 'characterCreation.js?v=7' in i,'top-level cache bust'),
          ]
          failed=[label for ok,label in checks if not ok]
          if failed: raise SystemExit('Failed verification: '+', '.join(failed))
          print('Requested character sizing geometry verified')
          PY
          git diff --check

      - name: Commit tuned files and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-character-sizing.yml
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add humanoidRenderer.js clothingLayers.js clothingSystem.js characterCreation.js name.js index.html
          git commit -m 'Tune armour clothing and undergarment fit'
          git push origin HEAD:development
