name: Humanoid Renderer Focused Tests

# Deliberately scoped to the direct humanoid + clothing regressions; do not expand this to the full suite.
on:
  push:
    branches:
      - development
    paths:
      - 'humanoidRenderer.js'
      - 'rendererAssetRecovery.js'
      - 'equipmentInterface.js'
      - 'clothingLayers.js'
      - 'clothingSystem.js'
      - 'characterCreation.js'
      - 'index.html'
      - 'entities.js'
      - 'graphicsSettings.js'
      - 'name.js'
      - 'tests/human-female-direct-render.spec.js'
      - 'tests/clothing-render-regression.spec.js'
      - 'tests/humanoid-body-fallback-regression.spec.js'
      - 'tests/armour-asset-consistency.spec.js'
      - 'images/characters/elf_female/**'
      - 'images/equipment/clothing/**'
      - 'images/equipment/armour/**'
      - '.github/workflows/human-female-render-diagnostic.yml'

concurrency:
  group: humanoid-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused humanoid, clothing and armour rendering regressions
        run: npx playwright test tests/human-female-direct-render.spec.js tests/clothing-render-regression.spec.js tests/humanoid-body-fallback-regression.spec.js tests/armour-asset-consistency.spec.js --reporter=line
