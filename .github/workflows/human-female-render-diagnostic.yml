name: Wire Elf Female Direct Renderer

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/human-female-render-diagnostic.yml'

permissions:
  contents: write

jobs:
  wire-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire elf female into direct compositor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          rp = Path('humanoidRenderer.js')
          r = rp.read_text()

          anchor = "        human_female: { bodyW:1.60, bodyH:1.92, yOff:-0.16, heightScale:1.92/2.16 },\n        human_male:   { bodyW:1.70, bodyH:2.06, yOff:-0.17, heightScale:2.06/2.16 },"
          repl = "        human_female: { bodyW:1.60, bodyH:1.92, yOff:-0.16, heightScale:1.92/2.16 },\n        elf_female:   { bodyW:1.60, bodyH:1.92, yOff:-0.16, heightScale:1.92/2.16 },\n        human_male:   { bodyW:1.70, bodyH:2.06, yOff:-0.17, heightScale:2.06/2.16 },"
          if anchor not in r: raise SystemExit('CHARACTER_RIGS anchor not found')
          r = r.replace(anchor, repl, 1)

          anchor = "        human_male: {\n            body: {\n                average: {\n                    front:'images/characters/human_male/body_front.png',"
          elf = "        elf_female: {\n            body: {\n                average: {\n                    front:'images/characters/elf_female/body_front.png',\n                    side:'images/characters/elf_female/body_side.png',\n                    back:'images/characters/elf_female/body_back.png',\n                },\n            },\n            // Elf body art is deliberately bald; hair remains a separate layer.\n            hair:null,\n        },\n"
          if anchor not in r: raise SystemExit('human_male path anchor not found')
          r = r.replace(anchor, elf + anchor, 1)

          anchor = "    CHARACTER_PATHS.human_male.hair = CHARACTER_PATHS.human_female.hair;\n\n    const DIRECTIONAL_LAYOUT = {"
          repl = "    CHARACTER_PATHS.human_male.hair = CHARACTER_PATHS.human_female.hair;\n    CHARACTER_PATHS.elf_female.hair = CHARACTER_PATHS.human_female.hair;\n\n    // Elf-female source art has different transparent framing from the human body sheets.\n    const BODY_VISIBLE_TARGETS = {\n        elf_female: {\n            front:{x:.14,y:.01,w:.72,h:.98},\n            side: {x:.30,y:.01,w:.40,h:.98},\n            back: {x:.125,y:.005,w:.75,h:.99},\n        },\n    };\n\n    const DIRECTIONAL_LAYOUT = {"
          if anchor not in r: raise SystemExit('shared hair/layout anchor not found')
          r = r.replace(anchor, repl, 1)

          anchor = "        return key === 'human_female' || key === 'human_male';"
          repl = "        return key === 'human_female' || key === 'human_male' || key === 'elf_female';"
          if anchor not in r: raise SystemExit('equipment baseline anchor not found')
          r = r.replace(anchor, repl, 1)

          anchor = "        human_female:{x:-.1873125,y:-.015,w:.374625,h:.2183},\n        default:{x:-.172125,y:-.015,w:.34425,h:.2006},"
          repl = "        human_female:{x:-.1873125,y:-.015,w:.374625,h:.2183},\n        elf_female:{x:-.1873125,y:-.015,w:.374625,h:.2183},\n        default:{x:-.172125,y:-.015,w:.34425,h:.2006},"
          if anchor not in r: raise SystemExit('helmet target anchor not found')
          r = r.replace(anchor, repl, 1)

          anchor = "            if (drawCropped(ctx, imageReady(bodyImage) ? bodyImage : sourceBody, layout.bodyCrop, layout.bodyDest, bounds)) {\n                layerOrder.push('body');\n            }"
          repl = "            const bodySource = imageReady(bodyImage) ? bodyImage : sourceBody;\n            const bodyTarget = BODY_VISIBLE_TARGETS[key]?.[view];\n            const bodyDrawn = bodyTarget\n                ? !!drawVisibleFit(ctx, bodySource, bounds, bodyTarget)\n                : drawCropped(ctx, bodySource, layout.bodyCrop, layout.bodyDest, bounds);\n            if (bodyDrawn) layerOrder.push('body');"
          if anchor not in r: raise SystemExit('body draw anchor not found')
          r = r.replace(anchor, repl, 1)

          anchor = "    window.HUMAN_FEMALE_DIRECTIONAL_LAYOUT = DIRECTIONAL_LAYOUT;\n    window.REAR_HUMAN_EQUIPMENT_ASSETS = REAR_EQUIPMENT_ASSETS;"
          repl = "    window.HUMAN_FEMALE_DIRECTIONAL_LAYOUT = DIRECTIONAL_LAYOUT;\n    window.ELF_FEMALE_DIRECTIONAL_ASSETS = {\n        body:CHARACTER_ASSETS.elf_female.body.average,\n        bodyTypes:CHARACTER_ASSETS.elf_female.body,\n        hair:CHARACTER_ASSETS.elf_female.hair,\n    };\n    window.REAR_HUMAN_EQUIPMENT_ASSETS = REAR_EQUIPMENT_ASSETS;"
          if anchor not in r: raise SystemExit('asset export anchor not found')
          r = r.replace(anchor, repl, 1)
          rp.write_text(r)

          tp = Path('tests/human-female-direct-render.spec.js')
          t = tp.read_text()
          anchor = "    const female = window.DIRECTIONAL_CHARACTER_ASSETS?.human_female;\n    const male = window.DIRECTIONAL_CHARACTER_ASSETS?.human_male;\n    return window.__humanoidRendererInstalled === true"
          repl = "    const female = window.DIRECTIONAL_CHARACTER_ASSETS?.human_female;\n    const male = window.DIRECTIONAL_CHARACTER_ASSETS?.human_male;\n    const elfFemale = window.DIRECTIONAL_CHARACTER_ASSETS?.elf_female;\n    return window.__humanoidRendererInstalled === true"
          if anchor not in t: raise SystemExit('matrix declarations anchor not found')
          t = t.replace(anchor, repl, 1)

          anchor = "      && male?.body?.broad?.side?.naturalWidth > 0\n      && male?.body?.broad?.back?.naturalWidth > 0;"
          repl = "      && male?.body?.broad?.side?.naturalWidth > 0\n      && male?.body?.broad?.back?.naturalWidth > 0\n      && elfFemale?.body?.average?.front?.naturalWidth > 0\n      && elfFemale?.body?.average?.side?.naturalWidth > 0\n      && elfFemale?.body?.average?.back?.naturalWidth > 0;"
          if anchor not in t: raise SystemExit('matrix readiness anchor not found')
          t = t.replace(anchor, repl, 1)

          anchor = "    expect(rendererSource).toContain(\"back:'images/characters/human_male/body_broad_back.png'\");"
          repl = anchor + "\n    expect(rendererSource).toContain(\"front:'images/characters/elf_female/body_front.png'\");\n    expect(rendererSource).toContain(\"side:'images/characters/elf_female/body_side.png'\");\n    expect(rendererSource).toContain(\"back:'images/characters/elf_female/body_back.png'\");\n    expect(rendererSource).toContain('CHARACTER_PATHS.elf_female.hair = CHARACTER_PATHS.human_female.hair;');"
          if anchor not in t: raise SystemExit('source assertion anchor not found')
          t = t.replace(anchor, repl, 1)

          anchor = "            if (race === 'human' && (gender === 'female' || gender === 'male')) {\n              directCount++;"
          repl = "            const directExpected = (race === 'human' && (gender === 'female' || gender === 'male'))\n              || (race === 'elf' && gender === 'female');\n            if (directExpected) {\n              directCount++;"
          if anchor not in t: raise SystemExit('matrix direct condition anchor not found')
          t = t.replace(anchor, repl, 1)
          if "expect(result.directCount).toBe(1728);" not in t: raise SystemExit('directCount assertion not found')
          t = t.replace("expect(result.directCount).toBe(1728);", "expect(result.directCount).toBe(2592);", 1)
          tp.write_text(t)

          np = Path('name.js')
          n = np.read_text()
          old = "const PRESENTATION_BUILD = '20260927-direct-humanoid-compositor';"
          new = "const PRESENTATION_BUILD = '20260928-elf-female-directional';"
          if old not in n: raise SystemExit('build token anchor not found')
          np.write_text(n.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused humanoid rendering regression
        run: npx playwright test tests/human-female-direct-render.spec.js --reporter=line
      - name: Commit renderer wiring
        shell: bash
        run: |
          set -euo pipefail
          git add humanoidRenderer.js name.js tests/human-female-direct-render.spec.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wire elf female directional sprites into renderer'
          git push origin HEAD:development
