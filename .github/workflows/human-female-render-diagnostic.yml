name: Apply Elf Female Sprite Files

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/human-female-render-diagnostic.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 1
      - name: Decode staged elf sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/characters/elf_female
          cat .asset-staging/elf_female/front.* | base64 -d > images/characters/elf_female/body_front.png
          cat .asset-staging/elf_female/side.*  | base64 -d > images/characters/elf_female/body_side.png
          cat .asset-staging/elf_female/back.*  | base64 -d > images/characters/elf_female/body_back.png
          sha256sum images/characters/elf_female/body_front.png images/characters/elf_female/body_side.png images/characters/elf_female/body_back.png
          rm -rf .asset-staging
          git add images/characters/elf_female .asset-staging
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add elf female directional body sprites'
          git push origin HEAD:development
