name: Humanoid Renderer Focused Tests

# Deliberately scoped to the direct humanoid regression; do not expand this to the full suite.
on:
  push:
    branches:
      - development
    paths:
      - 'humanoidRenderer.js'
      - 'name.js'
      - 'tests/human-female-direct-render.spec.js'
      - '.github/workflows/human-female-render-diagnostic.yml'

concurrency:
  group: humanoid-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose renderer asset loading
        run: |
          echo '--- checkout renderer broad references ---'
          grep -n "body_broad_" humanoidRenderer.js || true
          echo '--- all DIRECTIONAL_CHARACTER_ASSETS writers ---'
          grep -R -n --include='*.js' "DIRECTIONAL_CHARACTER_ASSETS" . --exclude-dir=node_modules || true
          node server.js >/tmp/hex-crpg-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 0.2
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:3000/', {waitUntil:'domcontentloaded'});
            await page.waitForFunction(() => window.__humanoidRendererReady === true, null, {timeout:10000});
            await page.waitForTimeout(1500);
            const status = await page.evaluate(async () => {
              const male = window.DIRECTIONAL_CHARACTER_ASSETS?.human_male;
              const liveSource = await fetch(`humanoidRenderer.js?diagnostic=${Date.now()}`, {cache:'no-store'}).then(r => r.text());
              return {
                scripts:Array.from(document.scripts).map(s => s.src).filter(src => src.includes('humanoidRenderer')),
                liveSourceHasMaleBroad:liveSource.includes("front:'images/characters/human_male/body_broad_front.png'"),
                bodyKeys:Object.keys(male?.body || {}),
                maleBroad:male?.body?.broad ? Object.fromEntries(Object.entries(male.body.broad).map(([view,image]) => [view,{src:image.src,complete:image.complete,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight}])) : null,
              };
            });
            console.log(JSON.stringify(status, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Stop after diagnostic
        run: exit 1
      - name: Run focused humanoid rendering regression
        run: npx playwright test tests/human-female-direct-render.spec.js --reporter=line
