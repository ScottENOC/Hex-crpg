name: Humanoid Renderer Focused Tests

on:
  push:
    branches:
      - development
    paths:
      - 'humanoidRenderer.js'
      - 'name.js'
      - 'tests/human-female-direct-render.spec.js'
      - '.github/workflows/human-female-render-diagnostic.yml'

concurrency:
  group: humanoid-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused humanoid rendering regression
        run: npx playwright test tests/human-female-direct-render.spec.js --reporter=line
