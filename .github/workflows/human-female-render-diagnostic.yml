name: Humanoid Renderer Focused Tests

# Deliberately scoped to the direct humanoid regression; do not expand this to the full suite.
on:
  push:
    branches:
      - development
    paths:
      - 'humanoidRenderer.js'
      - 'name.js'
      - 'tests/human-female-direct-render.spec.js'
      - '.github/workflows/human-female-render-diagnostic.yml'

concurrency:
  group: humanoid-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate retired renderer loaders
        run: |
          echo '--- facingSystem.js references ---'
          grep -R -n --include='*.js' --include='*.html' "facingSystem\.js" . --exclude-dir=node_modules || true
          echo '--- characterRig.js references ---'
          grep -R -n --include='*.js' --include='*.html' "characterRig\.js" . --exclude-dir=node_modules || true
          echo '--- directional legacy references ---'
          grep -R -n --include='*.js' --include='*.html' "directionalCharacterUI\.js\|directionalWeaponTuning\.js\|directionalEquipmentTuning\.js\|directionalRigHandoff\.js" . --exclude-dir=node_modules || true
      - name: Stop after diagnostic
        run: exit 1
