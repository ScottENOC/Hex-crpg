name: One-off Offline Cache Recovery Fix

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/human-female-render-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Patch, validate and push
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin development

          python3 -c 'from pathlib import Path; p=Path("offlineCache.js"); s=p.read_text(); old="""                const candidates = cacheNames\n                    .filter(name => prefixes.some(prefix => name.startsWith(prefix)))\n                    .filter(name => !/(?:^|-)patch(?:-|$)/i.test(name))\n                    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));"""; new="""                // Older v15 first installs could promote a fully complete cache\n                // whose name still contains \"patch\". Do not hide those here:\n                // incomplete staging caches have no completion manifest and are\n                // rejected below, while completed ones are safe to recover.\n                const candidates = cacheNames\n                    .filter(name => prefixes.some(prefix => name.startsWith(prefix)))\n                    .sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));"""; assert old in s; p.write_text(s.replace(old,new,1))'

          python3 -c 'from pathlib import Path; p=Path("offlineServiceWorker.js"); s=p.read_text(); old="""    const patchCacheName = `${GAME_CACHE_PREFIX}patch-${commit}`;\n    const patchCache = await caches.open(patchCacheName);"""; new="""    // Incremental updates use a temporary patch cache. A first install is\n    // already downloading the complete build, so give that cache its permanent\n    // canonical name immediately. Recovery still accepts older completed\n    // patch-named caches when they contain a valid completion manifest.\n    const patchCacheName = before.valid\n        ? `${GAME_CACHE_PREFIX}patch-${commit}`\n        : cacheNameForCommit(commit);\n    const patchCache = await caches.open(patchCacheName);"""; assert old in s; p.write_text(s.replace(old,new,1))'

          node --check offlineCache.js
          node --check offlineServiceWorker.js
          node --test tests-unit/offline-cache-regression.test.js
          grep -Fq ': cacheNameForCommit(commit);' offlineServiceWorker.js
          ! grep -Fq '.filter(name => !/(?:^|-)patch(?:-|$)/i.test(name))' offlineCache.js

          git checkout '${{ github.event.before }}' -- .github/workflows/human-female-render-diagnostic.yml
          git rm -f .github/workflows/apply-offline-cache-canonical-recovery.yml || true
          git add offlineCache.js offlineServiceWorker.js .github/workflows/human-female-render-diagnostic.yml
          git diff --cached --check
          git commit -m 'Recover completed offline caches reliably'
          git pull --rebase origin development
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          node --test tests-unit/offline-cache-regression.test.js
          git push origin HEAD:development
