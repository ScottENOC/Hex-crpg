name: Humanoid Renderer Asset Recovery Migration

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/human-female-render-diagnostic.yml'

permissions:
  contents: write

jobs:
  patch-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Add renderer-owned image retry and strengthen regression
        run: |
          git pull --rebase origin development
          python - <<'PY'
          from pathlib import Path

          renderer = Path('humanoidRenderer.js')
          text = renderer.read_text()
          old = """    function loadImage(src) {
                  if (typeof Image === 'undefined') return null;
                  const image = new Image();
                  image.addEventListener('load', () => {
                      window.drawMap?.();
                      window.renderEntities?.();
                      queuePortraitRefresh();
                  });
                  // Renderer-owned art uses the compositor build token so fresh clothing JS
                  // can never be paired with a stale/broken cached body image on iOS Safari.
                  const assetBuild = encodeURIComponent(window.PRESENTATION_BUILD || 'direct-humanoid-assets-v1');
                  const separator = src.includes('?') ? '&' : '?';
                  image.src = `${src}${separator}build=${assetBuild}`;
                  return image;
              }
          """
          new = """    function loadImage(src) {
                  if (typeof Image === 'undefined') return null;
                  const image = new Image();
                  const assetBuild = encodeURIComponent(window.PRESENTATION_BUILD || 'direct-humanoid-assets-v1');
                  const retryDelays = [100, 350, 900];
                  let attempt = 0;
                  const assign = () => {
                      const separator = src.includes('?') ? '&' : '?';
                      const retry = attempt ? `&assetRetry=${attempt}-${Date.now()}` : '';
                      image.src = `${src}${separator}build=${assetBuild}${retry}`;
                  };
                  image.addEventListener('load', () => {
                      window.drawMap?.();
                      window.renderEntities?.();
                      queuePortraitRefresh();
                  });
                  image.addEventListener('error', () => {
                      if (attempt >= retryDelays.length) return;
                      const delay = retryDelays[attempt];
                      attempt += 1;
                      setTimeout(() => {
                          if (image.naturalWidth > 0 && image.naturalHeight > 0) return;
                          assign();
                      }, delay);
                  });
                  // Renderer-owned art uses the compositor build token so fresh clothing JS
                  // can never be paired with a stale/broken cached body image on iOS Safari.
                  // Retry here, where the Image is created, rather than relying on the later
                  // recovery module to attach an error handler before a fast failure occurs.
                  assign();
                  return image;
              }
          """
          if old not in text:
              raise SystemExit('Expected loadImage block not found')
          renderer.write_text(text.replace(old, new, 1))

          test = Path('tests/visibility-assets.spec.js')
          text = test.read_text()
          old = """  test('braid uses its tight directional art when facing right and back', async ({ page }) => {
              await createCharacter(page, { race:'human', gender:'female' });
              await page.waitForFunction(() => {
                const set = window.DIRECTIONAL_CHARACTER_ASSETS?.human_female?.hair?.braid;
                return window.__humanoidRendererReady
                  && set?.front?.naturalWidth > 0
                  && set?.side?.naturalWidth > 0
                  && set?.back?.naturalWidth > 0;
              });
              await page.evaluate(() => {
          """
          new = """  test('braid recovers its side/back images and uses tight directional art', async ({ page }) => {
              let sideRequests = 0;
              let backRequests = 0;
              await page.route('**/images/characters/human_female/hair_braid_side.png*', async route => {
                sideRequests += 1;
                if (sideRequests === 1) await route.abort('failed');
                else await route.continue();
              });
              await page.route('**/images/characters/human_female/hair_braid_back.png*', async route => {
                backRequests += 1;
                if (backRequests === 1) await route.abort('failed');
                else await route.continue();
              });

              await createCharacter(page, { race:'human', gender:'female' });
              await expect.poll(async () => page.evaluate(() => {
                const set = window.DIRECTIONAL_CHARACTER_ASSETS?.human_female?.hair?.braid;
                return {
                  rendererReady: !!window.__humanoidRendererReady,
                  front: set?.front?.naturalWidth || 0,
                  side: set?.side?.naturalWidth || 0,
                  back: set?.back?.naturalWidth || 0,
                };
              }), { timeout: 10000 }).toEqual({ rendererReady:true, front:1254, side:175, back:192 });
              await page.evaluate(() => {
          """
          if old not in text:
              raise SystemExit('Expected braid regression setup not found')
          text = text.replace(old, new, 1)
          old_tail = """    expect(back.hair.sourceWidth).toBeGreaterThan(0);
              expect(back.hair.sourceWidth).toBeLessThan(400);
            });
          });
          """
          new_tail = """    expect(back.hair.sourceWidth).toBeGreaterThan(0);
              expect(back.hair.sourceWidth).toBeLessThan(400);
              expect(sideRequests).toBeGreaterThanOrEqual(2);
              expect(backRequests).toBeGreaterThanOrEqual(2);
            });
          });
          """
          if old_tail not in text:
              raise SystemExit('Expected braid regression tail not found')
          test.write_text(text.replace(old_tail, new_tail, 1))

          workflow = '''name: Humanoid Renderer Focused Tests

          # Deliberately scoped to the direct humanoid + clothing regressions; do not expand this to the full suite.
          on:
            push:
              branches:
                - development
              paths:
                - 'humanoidRenderer.js'
                - 'rendererAssetRecovery.js'
                - 'equipmentInterface.js'
                - 'clothingLayers.js'
                - 'clothingSystem.js'
                - 'characterCreation.js'
                - 'braidDirectionalHair.js'
                - 'index.html'
                - 'entities.js'
                - 'graphicsSettings.js'
                - 'name.js'
                - 'tests/human-female-direct-render.spec.js'
                - 'tests/humanoid-body-fallback-regression.spec.js'
                - 'tests/armour-asset-consistency.spec.js'
                - 'tests/visibility-assets.spec.js'
                - 'images/characters/elf_female/**'
                - 'images/characters/human_female/**'
                - 'images/equipment/clothing/**'
                - 'images/equipment/armour/**'
                - '.github/workflows/human-female-render-diagnostic.yml'

          concurrency:
            group: humanoid-renderer-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            focused-render:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                - name: Install dependencies
                  run: npm ci
                - name: Install Chromium
                  run: npx playwright install --with-deps chromium
                - name: Run focused humanoid, clothing and armour rendering regressions
                  run: npx playwright test tests/human-female-direct-render.spec.js tests/humanoid-body-fallback-regression.spec.js tests/armour-asset-consistency.spec.js tests/visibility-assets.spec.js --reporter=line
          '''
          # Dedent the embedded restored workflow without depending on extra packages.
          import textwrap
          Path('.github/workflows/human-female-render-diagnostic.yml').write_text(textwrap.dedent(workflow))
          PY
      - name: Commit and push source fix
        run: |
          git config user.name 'ScottENOC'
          git config user.email 'bales.scott@gmail.com'
          git add humanoidRenderer.js tests/visibility-assets.spec.js .github/workflows/human-female-render-diagnostic.yml
          git commit -m 'Retry renderer-owned assets at load source'
          git pull --rebase origin development
          git push origin HEAD:development
