name: Apply performance follow-up

on:
  push:
    branches: [development]
    paths:
      - '.github/scripts/apply-terrain-buffer-exploration-fix.py'
      - '.github/workflows/apply-terrain-buffer-exploration-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - name: Apply patch
        run: python3 .github/scripts/apply-terrain-buffer-exploration-fix.py
      - name: Check JavaScript
        run: |
          node --check hexMap.js
          node --check performanceMonitor.js
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hexMap.js performanceMonitor.js
          git commit -m 'Trim pathfinding hot loop and report render pacing'
          git push origin HEAD:development
