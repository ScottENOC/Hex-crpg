name: Fix renderer wrapper recursion

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/fix-renderer-wrapper-recursion.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Preserve direct compositor marker through precise colour wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('preciseAppearanceColor.js')
          text = path.read_text()
          old = "    wrapped.__preciseColourContext=true; wrapped.__preciseBase=base; window.drawPlayerCharacter=wrapped;\n"
          new = "    wrapped.__preciseColourContext=true; wrapped.__preciseBase=base;\n    if(base.__directHumanoidCompositor) wrapped.__directHumanoidCompositor=true;\n    window.drawPlayerCharacter=wrapped;\n"
          if old not in text:
              raise SystemExit('Expected precise draw-context wrapper line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run relevant humanoid renderer regressions
        run: npx playwright test tests/human-female-direct-render.spec.js --grep-invert "all selectable race, gender, class, body, armour and renderer-distinct equipment combinations"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preciseAppearanceColor.js
          git commit -m 'Prevent humanoid renderer wrapper recursion'
          git push origin HEAD:development
