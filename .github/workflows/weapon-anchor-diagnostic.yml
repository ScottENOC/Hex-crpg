name: Weapon Anchor Diagnostic

on:
  push:
    branches:
      - fix/weapon-anchor-tuning

jobs:
  directional-weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/human-female-side-weapons.spec.js tests/human-female-tactical-render.spec.js --reporter=line
