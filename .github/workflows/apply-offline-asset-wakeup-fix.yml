name: Apply offline asset wake-up fix

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-asset-wakeup-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply loader and renderer fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scheduler = Path('assetLoadScheduler.js')
          s = scheduler.read_text()
          s = s.replace("const SCHEDULER_VERSION = '7';", "const SCHEDULER_VERSION = '8';", 1)

          old = """    if (offlineStartupPending) {\n        window.__hexOfflineReady.finally(() => {\n            offlineStartupPending = false;\n            schedulePump();\n        });\n    }"""
          new = """    if (offlineStartupPending) {\n        window.__hexOfflineReady.finally(() => {\n            offlineStartupPending = false;\n            // Requests made while the full local copy was being prepared were\n            // deliberately parked as `deferred`. Wake every one now: otherwise\n            // renderer-owned Image objects can remain blank forever even though\n            // their bytes are already safely present in Cache Storage.\n            releaseManagedDeferred();\n            schedulePump();\n        });\n    }"""
          if old not in s:
              raise SystemExit('offline-ready block not found')
          s = s.replace(old, new, 1)

          old = """    function requestManaged(value,{priority=null,immediate=false}={}) {\n        const record=recordFor(value);\n        if (record.status==='suppressed') return record.image;"""
          new = """    function requestManaged(value,{priority=null,immediate=false}={}) {\n        const record=recordFor(value);\n        // A record may have been created while the offline startup barrier was\n        // active. Once that barrier is gone, any fresh request must be allowed\n        // to wake it instead of inheriting the stale `deferred` state forever.\n        if (record.status==='deferred' && !offlineStartupPending) record.status='idle';\n        if (record.status==='suppressed') return record.image;"""
          if old not in s:
              raise SystemExit('requestManaged block not found')
          s = s.replace(old, new, 1)
          scheduler.write_text(s)

          renderer = Path('humanoidRenderer.js')
          r = renderer.read_text()
          old = """        window.assetManager.whenReady(src).then(() => {\n            window.drawMap?.();\n            window.renderEntities?.();\n            queuePortraitRefresh();\n        }).catch(() => {});"""
          new = """        window.assetManager.whenReady(src).then(() => {\n            window.drawMap?.();\n            window.renderEntities?.();\n            queuePortraitRefresh();\n            // The creator preview may have tried to draw while this image was\n            // still deferred. Redraw it now rather than leaving a blank canvas\n            // until the player happens to touch another appearance control.\n            if (document.getElementById('appearance-preview-canvas')) {\n                requestAnimationFrame(() => window.updateAppearancePreview?.());\n            }\n        }).catch((error) => {\n            console.warn('Humanoid renderer art failed to load:', src, error);\n            if (!rendererImageCache.get(`reported:${src}`)) {\n                rendererImageCache.set(`reported:${src}`, true);\n                window.showMessage?.(`Art asset failed to load: ${src.split('/').pop()} — ${error?.message || 'load failed'}`);\n            }\n        });"""
          if old not in r:
              raise SystemExit('renderer loadImage block not found')
          r = r.replace(old, new, 1)

          old = """            ctx.clearRect(0,0,canvas.width,canvas.height);\n            const height = canvas.height*.90;\n            const width = height*HUMAN_RENDER_ASPECT;\n            drawDirectionalHumanoidInBounds(ctx, preview, {left:(canvas.width-width)/2,top:(canvas.height-height)/2,width,height}, 'down');"""
          new = """            ctx.clearRect(0,0,canvas.width,canvas.height);\n            const height = canvas.height*.90;\n            const width = height*HUMAN_RENDER_ASPECT;\n            const rendered = drawDirectionalHumanoidInBounds(ctx, preview, {left:(canvas.width-width)/2,top:(canvas.height-height)/2,width,height}, 'down');\n            // Never turn a temporarily-unready direct sprite into an empty\n            // preview. The legacy preview is a safe visual fallback while the\n            // directional body finishes decoding; the ready callback above will\n            // replace it as soon as the direct asset is available.\n            if (!rendered) return creatorLegacy.apply(this, arguments);"""
          if old not in r:
              raise SystemExit('creator preview draw block not found')
          r = r.replace(old, new, 1)
          renderer.write_text(r)

          index = Path('index.html')
          i = index.read_text()
          i = i.replace('assetLoadScheduler.js?v=7', 'assetLoadScheduler.js?v=8', 1)
          i = i.replace('20261001-pwa-offline-cache-v2', '20261001-pwa-offline-cache-v3', 1)
          index.write_text(i)
          PY
      - name: Syntax check changed JavaScript
        run: |
          node --check assetLoadScheduler.js
          node --check humanoidRenderer.js
      - name: Verify fix wiring
        run: |
          grep -q "SCHEDULER_VERSION = '8'" assetLoadScheduler.js
          grep -q "releaseManagedDeferred();" assetLoadScheduler.js
          grep -q "record.status==='deferred' && !offlineStartupPending" assetLoadScheduler.js
          grep -q "const rendered = drawDirectionalHumanoidInBounds" humanoidRenderer.js
          grep -q "assetLoadScheduler.js?v=8" index.html
      - name: Commit fix and remove one-off workflow
        run: |
          rm .github/workflows/apply-offline-asset-wakeup-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assetLoadScheduler.js humanoidRenderer.js index.html .github/workflows/apply-offline-asset-wakeup-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Wake deferred art after offline cache is ready'
          git push origin HEAD:development
