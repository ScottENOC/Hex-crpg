name: Apply offline cache diagnostics v13
on:
  push:
    branches: [development]
    paths:
      - scripts/apply_offline_diagnostics_v13.py
      - .github/workflows/apply-offline-diagnostics-v13.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: |
          git fetch origin development
          git reset --hard origin/development
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply diagnostics patch
        run: |
          sed -i "s/hex-offline-reloaded-commit-v12/hex-offline-reloaded-commit-v11/" scripts/apply_offline_diagnostics_v13.py
          python3 scripts/apply_offline_diagnostics_v13.py
      - name: Validate JavaScript and diagnostic wiring
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
          grep -q "const VERSION = '13'" offlineCache.js
          grep -q "const SW_VERSION = '13'" offlineServiceWorker.js
          grep -q "HEX_CACHE_DIAGNOSTICS" offlineServiceWorker.js
          grep -q "Inspect local copy" offlineCache.js
          grep -q "physicalPresent" offlineServiceWorker.js
          grep -q 'offlineCache.js?v=13' index.html
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_offline_diagnostics_v13.py
          rm .github/workflows/apply-offline-diagnostics-v13.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offlineCache.js offlineServiceWorker.js index.html scripts/apply_offline_diagnostics_v13.py .github/workflows/apply-offline-diagnostics-v13.yml
          git commit -m 'Expose offline cache reuse diagnostics'
          git pull --rebase origin development
          git push origin HEAD:development
