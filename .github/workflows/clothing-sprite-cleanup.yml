name: Temporary clothing sprite cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/clothing-sprite-cleanup.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect newly uploaded PNG backgrounds
        run: |
          python - <<'PY'
          from PIL import Image
          paths = [
            'images/equipment/clothing/bra_side.png',
            'images/equipment/clothing/briefs_female_side.png',
            'images/equipment/clothing/pants_baggy_wraps_back.png',
            'images/equipment/clothing/pants_baggy_wraps_front.png',
            'images/equipment/clothing/pants_baggy_wraps_side.png',
            'images/equipment/clothing/pants_breaches_back.png',
            'images/equipment/clothing/pants_breaches_side.png',
            'images/equipment/clothing/pants_hose_back.png',
            'images/equipment/clothing/pants_hose_side.png',
          ]
          for p in paths:
              im = Image.open(p).convert('RGBA')
              w,h = im.size
              pts = [(0,0),(w-1,0),(0,h-1),(w-1,h-1),(w//2,0),(w//2,h-1),(0,h//2),(w-1,h//2)]
              samples = [im.getpixel(xy) for xy in pts]
              amin,amax = im.getchannel('A').getextrema()
              print(f'{p}: size={w}x{h} alpha={amin}..{amax} edge={samples}')
          PY
      - name: Find clothing references and naming mismatches
        run: |
          for pattern in traveler_garb top_masc_buttoned top_masc_toggle pants_baggy_wraps pants_breaches pants_breeches pants_hose briefs_female bra_side; do
            echo "--- $pattern ---"
            grep -RIn "$pattern" . --exclude-dir=.git --exclude='.github/workflows/clothing-sprite-cleanup.yml' || true
          done
          echo '--- item labels ---'
          grep -RInEi 'travell?er.s garb|buttoned shirt|toggle shirt|baggy.*wrap|breeches|hose' . --exclude-dir=.git --exclude='*.png' --exclude='*.svg' --exclude='.github/workflows/clothing-sprite-cleanup.yml' || true
