name: Temporary clothing sprite cleanup

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/clothing-sprite-cleanup.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect newly uploaded PNG backgrounds
        run: |
          python - <<'PY'
          from PIL import Image
          paths = [
            'images/equipment/clothing/bra_side.png',
            'images/equipment/clothing/bra_back.png',
            'images/equipment/clothing/pants_baggy_side.png',
            'images/equipment/clothing/pants_baggy_wraps_back.png',
            'images/equipment/clothing/pants_baggy_wraps_side.png',
            'images/equipment/clothing/shirt_dark_drape_back.png',
            'images/equipment/clothing/shirt_dark_drape_side.png',
            'images/equipment/clothing/tights_side.png',
            'images/equipment/clothing/trousers_single_leg_side.png',
          ]
          for p in paths:
              im = Image.open(p).convert('RGBA')
              w,h = im.size
              pts = [(0,0),(w-1,0),(0,h-1),(w-1,h-1),(w//2,0),(w//2,h-1),(0,h//2),(w-1,h//2)]
              samples = [im.getpixel(xy) for xy in pts]
              amin,amax = im.getchannel('A').getextrema()
              print(f'{p}: size={w}x{h} alpha={amin}..{amax} edge={samples}')
          PY
      - name: Find deprecated clothing references
        run: |
          echo '--- traveler garb references ---'
          grep -RInE 'travell?er(s)?[_ -]?garb|traveler_garb' . --exclude-dir=.git || true
          echo '--- top_masc_buttoned references ---'
          grep -RIn 'top_masc_buttoned' . --exclude-dir=.git || true
          echo '--- top_masc_toggle references ---'
          grep -RIn 'top_masc_toggle' . --exclude-dir=.git || true
          echo '--- related item labels ---'
          grep -RInEi 'travell?er.s garb|buttoned shirt|toggle shirt' . --exclude-dir=.git --exclude='*.png' --exclude='*.svg' || true
