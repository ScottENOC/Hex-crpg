name: Source anchor smoke

on:
  pull_request:
    paths:
      - 'directionalWeaponTuning.js'
      - 'directionalEquipmentTuning.js'
      - 'tests/source-asset-anchor-contract.spec.js'
      - '.github/workflows/source-anchor-smoke.yml'

jobs:
  source-anchor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run source anchor contract regression
        run: npx playwright test tests/source-asset-anchor-contract.spec.js --project=chromium
