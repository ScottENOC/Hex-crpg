name: Apply offline cache persistence v3 fix
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/apply-offline-cache-persistence-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Move to latest development
        run: git pull --ff-only origin development
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/apply-offline-cache-v3.py
      - name: Syntax check
        run: |
          node --check offlineCache.js
          node --check offlineServiceWorker.js
      - name: Verify v3 wiring
        run: |
          grep -q "const VERSION = '3'" offlineCache.js
          grep -q "offlineServiceWorker.js?v=3" offlineCache.js
          grep -q "LEGACY_GAME_CACHE_PREFIXES" offlineServiceWorker.js
          grep -q "recoveredAt" offlineServiceWorker.js
          grep -q "offlineCache.js?v=3" index.html
          ! grep -q "await navigator.storage.persist()" offlineCache.js
      - name: Commit fix and remove one-off patcher
        run: |
          rm .github/workflows/apply-offline-cache-persistence-v3.yml
          rm scripts/apply-offline-cache-v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offlineCache.js offlineServiceWorker.js index.html .github/workflows/apply-offline-cache-persistence-v3.yml scripts/apply-offline-cache-v3.py
          git commit -m "Persist and reuse iOS offline game cache"
          git push origin HEAD:development