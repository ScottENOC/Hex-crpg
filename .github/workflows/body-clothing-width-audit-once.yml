name: Audit body and clothing widths once
on:
  push:
    branches: [development]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Measure body, clothing and armour silhouettes
        run: |
          python - <<'PY'
          from PIL import Image
          import json

          paths={
            'body_average':'images/characters/human_female/body_front.png',
            'body_broad':'images/characters/human_female/body_broad_front.png',
            'heavy_armour':'images/humanheavyarmour.png',
            'blouse':'images/equipment/clothing/top_blouse.png',
            'shirt':'images/equipment/clothing/top_shirt.png',
            'tunic':'images/equipment/clothing/top_tunic.png',
            'dress':'images/equipment/clothing/top_dress.png',
          }
          imgs={k:Image.open(v).convert('RGBA') for k,v in paths.items()}

          def row_span(im,y,alpha=8,x0=0,x1=None):
            w,h=im.size; x1=w if x1 is None else x1
            y=max(0,min(h-1,int(round(y))))
            a=im.getchannel('A').load()
            xs=[x for x in range(max(0,int(x0)),min(w,int(x1))) if a[x,y]>=alpha]
            return 0 if not xs else max(xs)-min(xs)+1

          def alpha_bbox(im,alpha=8):
            w,h=im.size; a=im.getchannel('A').load(); xs=[]; ys=[]
            for y in range(h):
              for x in range(w):
                if a[x,y]>=alpha: xs.append(x); ys.append(y)
            return (min(xs),min(ys),max(xs),max(ys))

          # Current front body renderer crop -> full character bounds.
          body_crop={'x':.350,'y':.088,'w':.297,'h':.823}
          # Current fitted clothing and armour targets.
          targets={
            'shirt':{'x':.077,'y':.205,'w':.846,'h':.3665},
            'dress':{'x':.077,'y':.205,'w':.846,'h':.810},
            'armour':{'x':.03,'y':.195,'w':.94,'h':.810},
          }
          samples={'shoulders':.255,'upper_chest_arms':.305,'mid_chest':.365,'lower_torso':.445,'waist':.535}

          def body_width(name,char_y):
            im=imgs[name]; w,h=im.size
            sx0=body_crop['x']*w; sx1=(body_crop['x']+body_crop['w'])*w
            sy=(body_crop['y']+char_y*body_crop['h'])*h
            src=row_span(im,sy,x0=sx0,x1=sx1)
            crop_px=(sx1-sx0)
            return src/crop_px

          def fit_geom(name,kind):
            im=imgs[name]; l,t,r,b=alpha_bbox(im); tw=r-l+1; th=b-t+1; target=targets[kind]
            s=min(target['w']/tw,target['h']/th)
            dw=tw*s; dh=th*s; dx=target['x']+(target['w']-dw)/2
            dy=target['y'] if kind=='dress' else target['y']+(target['h']-dh)
            return l,t,r,b,s,dx,dy,dw,dh

          def clothing_width(name,kind,char_y):
            im=imgs[name]; l,t,r,b,s,dx,dy,dw,dh=fit_geom(name,kind)
            if not (dy<=char_y<=dy+dh): return 0
            sy=t+(char_y-dy)/s
            return row_span(im,sy)*s

          def armour_scale(t):
            shoulders,waist,hips=1.00,1.02,1.10
            shoulderY,waistY,hipY=.18,.53,.84
            def lerp(a,b,u):
              u=max(0,min(1,u)); return a+(b-a)*u
            if t<=waistY: return lerp(shoulders,waist,(t-shoulderY)/(waistY-shoulderY))
            return lerp(waist,hips,(t-waistY)/(hipY-waistY))

          armour_bbox=alpha_bbox(imgs['heavy_armour'])
          def armour_width(char_y):
            im=imgs['heavy_armour']; l,t,r,b=armour_bbox; tw=r-l+1; th=b-t+1; target=targets['armour']
            sx=target['w']/tw; sy=target['h']/th
            src_y=t+(char_y-target['y'])/sy
            row=row_span(im,src_y)
            norm=max(0,min(1,(src_y-t)/th))
            return row*sx*armour_scale(norm)

          report={}
          for label,y in samples.items():
            a=body_width('body_average',y); b=body_width('body_broad',y); arm=armour_width(y)
            report[label]={'y':y,'body_average':round(a,4),'body_broad':round(b,4),'heavy_armour':round(arm,4)}
            for n in ['blouse','shirt','tunic','dress']:
              kind='dress' if n=='dress' else 'shirt'
              c=clothing_width(n,kind,y)
              report[label][n]=round(c,4)
              report[label][n+'_vs_body_avg']=round(c/a,3) if a else None
              report[label][n+'_vs_armour']=round(c/arm,3) if arm else None
          print('BODY_CLOTHING_WIDTH_REPORT_BEGIN')
          print(json.dumps(report,indent=2))
          print('BODY_CLOTHING_WIDTH_REPORT_END')
          PY
      - name: Remove one-time audit workflow
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/body-clothing-width-audit-once.yml
          git commit -m "Remove one-time body clothing width audit" || true
          git push
