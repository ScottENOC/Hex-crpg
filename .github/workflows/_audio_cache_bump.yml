name: Temporary audio cache bump

on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/_audio_cache_bump.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Bump audio entry script versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = s
          s = s.replace('audio.js?v=5', 'audio.js?v=6')
          s = s.replace('musicDirector.js?v=5', 'musicDirector.js?v=6')
          if s == old:
              raise SystemExit('expected audio script version strings not found')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump audio script cache versions'
          git push origin HEAD:development
