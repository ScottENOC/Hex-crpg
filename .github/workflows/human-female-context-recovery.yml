name: Human Female Armour Context Recovery

on:
  push:
    branches:
      - fix/human-female-armour-context-fallback

jobs:
  focused-armour-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check handoff
        run: node --check directionalRigHandoff.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run focused human-female rig tests
        run: >-
          npx playwright test
          tests/human-female-rig-load-order.spec.js
          tests/human-female-direct-render.spec.js
          tests/human-female-armour-transform.spec.js
          --reporter=line
