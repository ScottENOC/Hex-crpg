<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <g stroke="#2a1d18" stroke-linejoin="round" stroke-linecap="round">
    <!-- semi-transparent cloth preserves the detailed baked-in body shading -->
    <path fill="#c94a48" fill-opacity="0.76" stroke-width="16" d="M352 300 L430 264 L512 282 L594 264 L672 300 L692 430 L650 452 L625 392 L620 620 L404 620 L399 392 L374 452 L332 430 Z"/>
    <path fill="#3f60c0" fill-opacity="0.72" stroke-width="14" d="M432 266 L512 332 L592 266 L558 246 L512 278 L466 246 Z"/>
    <path fill="#3f60c0" fill-opacity="0.60" stroke-width="10" d="M405 430 L460 414 L470 592 L414 602 Z M619 430 L564 414 L554 592 L610 602 Z"/>

    <!-- tailored seams / folds -->
    <g fill="none" stroke="#5b2628" stroke-width="10" opacity="0.82">
      <path d="M430 300 Q452 382 438 596"/>
      <path d="M594 300 Q572 382 586 596"/>
      <path d="M512 332 L512 606"/>
      <path d="M404 510 Q512 540 620 510"/>
    </g>
    <g fill="none" stroke="#6f79c8" stroke-width="8" opacity="0.72">
      <path d="M450 286 Q512 344 574 286"/>
      <path d="M421 468 Q445 478 468 470"/>
      <path d="M603 468 Q579 478 556 470"/>
    </g>

    <!-- leather belt, pouch and shoulder strap -->
    <path fill="#6a432a" stroke-width="14" d="M394 592 L630 592 L638 648 L386 648 Z"/>
    <rect x="484" y="598" width="56" height="42" rx="7" fill="#c89a4b" stroke-width="11"/>
    <path d="M424 276 L600 620" fill="none" stroke="#6a432a" stroke-width="22" opacity="0.9"/>
    <path fill="#5a3824" stroke-width="12" d="M598 522 Q660 528 668 576 L662 640 Q630 656 596 640 Z"/>

    <!-- lower tunic split and boot tops; pants remain visible beneath -->
    <path fill="#b84042" fill-opacity="0.62" stroke-width="13" d="M406 618 L500 618 L488 752 L408 730 Z M524 618 L618 618 L616 730 L536 752 Z"/>
    <path fill="#4b3327" stroke-width="12" d="M366 842 L478 842 L472 968 L350 968 Z M546 842 L658 842 L674 968 L552 968 Z"/>
    <g fill="none" stroke="#b68d62" stroke-width="7" opacity="0.65">
      <path d="M372 886 L470 886 M370 920 L468 920 M554 886 L660 886 M558 920 L664 920"/>
    </g>
  </g>
</svg>